<!-- Modelo: ANTES × DEPOIS.
     O slide que mais prende no feed, porque mostra o ganho em vez de descrevê-lo.
     Serve com print (dois `.recorte`) ou com desenho em CSS, como o cupom abaixo. -->
<div class="slide slide--suave">
  <div class="topo">
    <span class="logo"></span>
    <span class="contador">3 de 7</span>
  </div>

  <div class="empurra"></div>

  <div class="pilha g40">
    <span class="chapeu">No papel</span>
    <h2 class="titulo titulo--pequeno">
      O mesmo cupom, <span class="destaque">com</span> e sem destaque
    </h2>
    <div class="par">
      <div class="pilha g24 centro">
        <span class="cartao__rotulo">Antes</span>
        <div class="cupom">
          <div class="cupom__linha"><span>1x One Burger</span><span>39,00</span></div>
          <div class="cupom__linha"><span>1x Coca 350ml</span><span>7,00</span></div>
          <div class="cupom__linha"><span>1x Molho extra</span><span>2,00</span></div>
          <div class="cupom__corte"></div>
          <div class="cupom__linha"><span>TOTAL</span><span>48,00</span></div>
        </div>
      </div>
      <div class="pilha g24 centro">
        <span class="cartao__rotulo">Depois</span>
        <div class="cupom">
          <div class="cupom__linha"><span>1x One Burger</span><span>39,00</span></div>
          <div class="cupom__linha cupom__linha--destaque">
            <span>1x Coca 350ml</span><span>7,00</span>
          </div>
          <div class="cupom__linha cupom__linha--destaque">
            <span>1x Molho extra</span><span>2,00</span>
          </div>
          <div class="cupom__corte"></div>
          <div class="cupom__linha"><span>TOTAL</span><span>48,00</span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="empurra"></div>

  <div class="rodape">
    <span class="pontos">
      <span></span><span></span><span class="on"></span><span></span>
    </span>
    <span>beefood.app</span>
  </div>
</div>
