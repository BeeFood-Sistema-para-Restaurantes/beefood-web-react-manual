<!-- Banner de CAPA, imagem.
     Produto, preço e foto reais do cardápio modelo (ONE Stand): TASTY BACON
     (COMBO), R$ 41,90 na menor variação. Preço inventado em arte de exemplo é
     mentira barata — o cardápio público tem o número.
     `arte--capa` joga o texto para a faixa de cima: embaixo entra o logotipo
     da loja, desenhado pelo próprio cardápio. -->
<div class="arte arte--capa">
  <div class="arte__texto">
    <p class="arte__selo">Combo do dia</p>
    <h1 class="arte__titulo">Tasty <em>Bacon</em></h1>
    <p class="arte__preco">R$ 41,90
      <small>burger, batata e bebida</small></p>
  </div>
  <div class="arte__foto">
    <img src="skill:fotos/foto-tasty-bacon.png" alt="">
  </div>
</div>
