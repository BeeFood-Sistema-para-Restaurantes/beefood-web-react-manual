<!-- Modelo: CTA (último slide).
     Um pedido só. Dois pedidos no mesmo slide não geram duas ações, geram zero.
     Quando existe manual da funcionalidade, o CTA é o manual.
     Com imagem (celular em sangria mostrando para onde o leitor vai) rende mais
     que CTA só de texto — e o print da página de destino já é a prova. O celular
     está sozinho na faixa, então a sangria vai centralizada e grande. -->
<div class="slide slide--capa">
  <div class="topo">
    <span class="logo"></span>
    <span class="contador">8 de 8</span>
  </div>

  <div class="pilha g24" style="margin-top: 50px; max-width: 880px">
    <span class="chapeu">Passo a passo completo</span>
    <h2 class="titulo titulo--pequeno">
      Todo recurso novo vira <span class="destaque">manual</span> no mesmo dia
    </h2>
    <p class="subtitulo">
      Abra <b>beefood.app/novidades</b> e veja tudo que entrou nesta semana.
    </p>
  </div>

  <div class="sangria" style="top: 520px; right: 210px; width: 660px">
    <div class="celular">
      <div class="celular__tela">
        <img src="../imagens-puras/08-destino.png" alt="Página de destino no celular">
      </div>
    </div>
  </div>

  <!-- Sem rodapé: o aparelho centralizado cobre a base, e o endereço já está no
       subtítulo, em negrito, que é onde ele é lido. -->
</div>
