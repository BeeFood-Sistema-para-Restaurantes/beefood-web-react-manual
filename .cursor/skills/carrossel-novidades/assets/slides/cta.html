<!-- Modelo: CTA (último slide).
     Um pedido só. Dois pedidos no mesmo slide não geram duas ações, geram zero.
     Quando existe manual da funcionalidade, o CTA é o manual. -->
<div class="slide slide--capa">
  <div class="topo">
    <span class="logo"></span>
    <span class="data">7 de 7</span>
  </div>

  <div class="empurra"></div>

  <div class="pilha g40">
    <span class="chapeu">Passo a passo completo</span>
    <h2 class="titulo titulo--medio">
      Está no manual <span class="destaque">Destaque na impressão</span>
    </h2>
    <p class="subtitulo">
      Abra o BeeFood, vá em <b>Manual</b> no menu e procure por destaque.
      Leva dois minutos para ligar na sua loja.
    </p>
  </div>

  <div class="empurra"></div>

  <div class="rodape">
    <span>beefood.app/novidades</span>
    <span class="arraste">@beefood</span>
  </div>
</div>
