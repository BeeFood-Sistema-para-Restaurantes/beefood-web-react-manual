<!-- Modelo: Totem de Autoatendimento.

     O aparelho é um armário **branco**: tela em pé (9/16) com moldura preta
     fina, um painel embaixo dela com leitor de aproximação, boca de impressora
     e pinpad, e coluna + base pretas mais estreitas que a carcaça. O painel é o
     que faz ler "autoatendimento"; sem ele sobra um celular gigante numa
     coluna.

     **Totem nunca vai em 3D.** O giro valoriza a espessura da peça, e armário
     em pé não tem espessura — girado, ele lê como armário tombando. 3D é para
     celular e para janela de computador.

     Larguras que cabem, com o texto acima:

       410 px  sozinho na faixa, centralizado, `top: 522px`
               (carcaça 802 px: topo 17 + tela 641 + painel 144);
       396 px  com coluna de texto ao lado, `top: 462px right: 46px`;
       322 px  pequeno, dividindo a capa com outro aparelho.

     A coluna pode sair pela base do slide — a borda de baixo lê como chão. O
     **painel, não**: ele é o que identifica o aparelho.

     A tela aqui é desenhada e por isso o slide leva `.selo-ilustracao`. Ela
     copia o layout do print de produção do manual
     (`manuais/traducao-cardapio-presencial/imagens-puras/08-totem-menu-idioma.png`):
     coluna de setores em caixa alta com o ativo sublinhado de vermelho, banner
     no topo, grade de produtos com foto e a barra da sacola no pé.

     As fotos dos produtos e o banner saem de um recorte do próprio print, feito
     por um `preparar-telas.py` na pasta do carrossel — este modelo vai sem
     imagem para renderizar sozinho. Troque os `<div class="tela-totem__card">`
     por `<img src="../imagens-puras/…">` + o bloco de texto. -->
<div class="slide slide--suave">
  <div class="topo">
    <span class="logo"></span>
    <span class="contador">3 de 7</span>
  </div>

  <div class="pilha g24" style="margin-top: 50px; max-width: 600px">
    <span class="chapeu">No totem</span>
    <h2 class="titulo titulo--pequeno">
      Título de duas linhas, com <span class="destaque">uma</span> palavra em vermelho
    </h2>
    <p class="corpo">
      Três linhas curtas, no máximo, na coluna ao lado do aparelho.
    </p>
  </div>

  <span class="selo-ilustracao" style="left: 88px; top: 796px">Ilustração</span>

  <div class="sangria" style="top: 462px; right: 46px; width: 396px">
    <div class="totem" style="width: 396px; --coluna: 300px">
      <div class="totem__tela">
        <!-- Tela de espera: o botão de começar e o seletor de idioma embaixo
             dele, que é onde o sistema põe. Fundo cinza claro, como no print. -->
        <div class="tela-totem tela-totem--espera" style="font-size: 22px">
          <div class="tela-totem__botao">FAÇA SEU PEDIDO</div>
          <div class="tela-totem__idiomas">
            <span class="bandeira bandeira--anel"><span>&#127463;&#127479;</span></span>
            <span class="bandeira"><span>&#127482;&#127480;</span></span>
            <span class="bandeira"><span>&#127466;&#127480;</span></span>
          </div>
        </div>

        <!-- Cardápio, para quando o slide precisa mostrar a lista. Troque pelo
             bloco de cima conforme o slide, não use os dois.

        <div class="tela-totem" style="font-size: 19px">
          <div class="tela-totem__setores">
            <div class="tela-totem__marca-caixa"><span></span></div>
            <div class="tela-totem__setor tela-totem__setor--ativo">DRINKS</div>
            <div class="tela-totem__setor">MOLHOS ADICIONAIS</div>
            <div class="tela-totem__setor">SIDES</div>
          </div>
          <div class="tela-totem__corpo">
            <div class="tela-totem__banner">
              <img src="../imagens-puras/tela-totem-banner.png" alt="">
            </div>
            <div class="tela-totem__rolagem">
              <div class="tela-totem__secao">Drinks</div>
              <div class="tela-totem__grade">
                <div class="tela-totem__card">
                  <img src="../imagens-puras/foto-bebida-1.png" alt="">
                  <div>
                    <span>Cola US</span><small>The drink cola</small><b>R$ 5,00</b>
                  </div>
                </div>
              </div>
              <div class="tela-totem__secao tela-totem__secao--sem-traducao">
                Molhos adicionais
              </div>
            </div>
            <div class="tela-totem__sacola"><i></i><span>0</span></div>
          </div>
        </div>
        -->
      </div>
      <div class="totem__painel">
        <div class="totem__leitor"></div>
        <div class="totem__impressora"></div>
        <div class="totem__pinpad">
          <div class="totem__tecla"><span></span><span></span><span></span></div>
          <div class="totem__tecla"><span></span><span></span><span></span></div>
          <div class="totem__tecla"><span></span><span></span><span></span></div>
        </div>
      </div>
      <div class="totem__coluna"></div>
      <div class="totem__base"></div>
    </div>
  </div>
</div>
