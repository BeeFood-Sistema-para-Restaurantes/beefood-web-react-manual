<!-- Modelo: Totem de Autoatendimento.

     O aparelho é um armário **branco**: tela em pé (9/16) com moldura preta
     fina, um painel embaixo dela com leitor de aproximação, boca de impressora
     e pinpad, e coluna + base pretas mais estreitas que a carcaça. O painel é o
     que faz ler "autoatendimento"; sem ele sobra um celular gigante numa
     coluna.

     **A tela pode ser captura de verdade.** O totem é web
     (`totem.beefood.app/?empresaID=&filialID=&token=`) e abre no Playwright —
     veja `capturar-totem.py` no carrossel da tradução. Prefira a captura; ela
     dispensa o `.selo-ilustracao` e não tem como estar errada.

     Desenhe a tela só quando a captura reduzida ficar ilegível no slide: em
     mockup de 400 px, a tela de espera (imagem e botão grandes) sobrevive, e o
     cardápio inteiro não — letra de 5 px no feed. Aí o CSS copia o layout da
     captura e usa as **fotos reais** que a API serve, e o slide leva o selo.

     **Totem nunca vai em 3D.** O giro valoriza a espessura da peça, e armário
     em pé não tem espessura — girado, ele lê como armário tombando. 3D é para
     celular e para janela de computador.

     Larguras que cabem, com o texto acima:

       400 px  sozinho na faixa, centralizado, `top: 532px`
               (carcaça 782 px: topo 16 + tela 626 + painel 141);
       420 px  com coluna de texto ao lado, `top: 452px right: 40px`;
       384 px  dividindo a capa com outro aparelho, `top: 366px right: 48px`.

     A coluna pode sair pela base do slide — a borda de baixo lê como chão. O
     **painel, não**: ele é o que identifica o aparelho.

     O `font-size` da `.tela-totem` é o que decide **onde a rolagem corta**
     (tudo lá dentro é `em`). Escolha o valor que deixa o último cartão inteiro,
     ou cortado dentro da foto: corte no meio do preço lê como falha de render.
     No totem de 420 px deste carrossel deu 19 px, com quatro cartões em duas
     linhas. -->

<div class="slide slide--suave">
  <div class="topo">
    <span class="logo"></span>
    <span class="contador">3 de 7</span>
  </div>

  <div class="pilha g24" style="margin-top: 50px; max-width: 600px">
    <span class="chapeu">No totem</span>
    <h2 class="titulo titulo--pequeno">
      Título de duas linhas, com <span class="destaque">uma</span> palavra em vermelho
    </h2>
    <p class="corpo">
      Três linhas curtas, no máximo, na coluna ao lado do aparelho.
    </p>
  </div>

  <span class="selo-ilustracao" style="left: 88px; top: 1196px">Ilustração</span>

  <div class="sangria" style="top: 452px; right: 40px; width: 420px">
    <div class="totem" style="width: 420px; --coluna: 300px">
      <div class="totem__tela">
        <!-- Melhor caso: a captura do totem inteira dentro da moldura. Aqui o
             slide não leva selo, e dá para apagar o `.selo-ilustracao` acima.

        <img src="../imagens-puras/totem-espera-en-720.png" alt="Tela de espera">
        -->

        <!-- Cardápio desenhado, para quando a captura reduzida não se lê. A
             coluna de setores usa miniatura de foto, como o aplicativo. -->
        <div class="tela-totem" style="font-size: 19px">
          <div class="tela-totem__setores">
            <div class="tela-totem__marca-caixa"><span></span></div>
            <div class="tela-totem__setor tela-totem__setor--ativo">
              <img src="../imagens-puras/foto-batata.png" alt="">
              <span>SIDES</span>
            </div>
            <div class="tela-totem__setor">
              <img src="../imagens-puras/foto-smash.png" alt="">
              <span>BURGERS</span>
            </div>
          </div>
          <div class="tela-totem__corpo">
            <!-- O banner é recorte da captura, e traz o CANCEL ORDER e a pílula
                 de bandeiras de produção dentro. -->
            <div class="tela-totem__banner">
              <img src="../imagens-puras/totem-banner-en.png" alt="">
            </div>
            <div class="tela-totem__rolagem">
              <div class="tela-totem__secao">Sides</div>
              <div class="tela-totem__grade">
                <div class="tela-totem__card">
                  <img src="../imagens-puras/foto-batata.png" alt="">
                  <div><span>FRENCH FRIES</span><b>R$ 11,00</b></div>
                </div>
                <div class="tela-totem__card">
                  <img src="../imagens-puras/foto-cebola.png" alt="">
                  <div><span>ONION RINGS</span><b>R$ 12,00</b></div>
                </div>
              </div>
            </div>
            <div class="tela-totem__sacola"><i></i><span>Your bag is empty</span></div>
          </div>
        </div>
      </div>
      <div class="totem__painel">
        <div class="totem__leitor"></div>
        <div class="totem__impressora"></div>
        <div class="totem__pinpad">
          <div class="totem__tecla"><span></span><span></span><span></span></div>
          <div class="totem__tecla"><span></span><span></span><span></span></div>
          <div class="totem__tecla"><span></span><span></span><span></span></div>
        </div>
      </div>
      <div class="totem__coluna"></div>
      <div class="totem__base"></div>
    </div>
  </div>
</div>
