<!-- Modelo: CAPA (slide 1)
     Gancho + UMA imagem. Capa só com texto perde para capa com imagem no feed,
     e a imagem certa é o resultado da novidade (o papel impresso, a tela nova),
     nunca um ícone decorativo. O título fala do problema no salão, não do nome
     do campo no sistema.
     Troque: pílula, título, subtítulo, data e a imagem da sangria.
     Cuidado: a coluna de texto tem de parar antes da borda esquerda do mockup —
     com `inclinado`, o papel avança ~15 px a mais do que a largura sugere. -->
<div class="slide slide--capa">
  <div class="topo">
    <span class="logo"></span>
    <span class="data">15/09/2026</span>
  </div>

  <div class="pilha g32" style="margin-top: 78px; max-width: 900px">
    <span class="pilula pilula--novidade">Novidade</span>
    <h1 class="titulo">Toda loja tem uma <span class="destaque">gambiarra</span> para não esquecer a bebida</h1>
    <p class="subtitulo" style="max-width: 400px">
      Canetinha na lata. Durex na comanda. Agora o papel avisa sozinho.
    </p>
  </div>

  <div class="sangria inclinado" style="top: 700px; right: 30px; width: 520px">
    <div class="recorte recorte--topo" style="aspect-ratio: 600 / 1000">
      <img src="../imagens-puras/01-resultado.png" alt="Cupom com o item em destaque">
    </div>
  </div>

  <div class="empurra"></div>

  <div class="rodape">
    <span class="arraste">Arraste &rarr;</span>
  </div>
</div>
