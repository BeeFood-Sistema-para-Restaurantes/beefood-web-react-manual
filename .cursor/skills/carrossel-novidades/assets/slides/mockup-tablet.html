<!-- Modelo: Cardápio Digital no Tablet, tela deitada no suporte de mesa.

     Sozinho na faixa, vai em `.figura`: centralizado, reto e no maior tamanho
     que couber. Em 880 px de largura a carcaça tem 565 px e o suporte mais
     81 px, e sobra chão com chapéu + título de 1 linha + 3 linhas de corpo
     acima. Dividindo a capa com outro aparelho, 640 px.

     **Tablet nunca vai em 3D**: girado, o suporte sai torto e o aparelho perde
     a escala. 3D é para celular e para janela de computador.

     O que faz ler "tablet" e não "monitor de mesa" mora no `base.css` e vale
     não mexer: aparelho **preto** com fio de alumínio em volta, moldura
     proporcional e igual nos quatro lados, canto bem arredondado, ponto da
     câmera na moldura da esquerda, dois botões na lateral direita e o suporte,
     que é uma **chapa curva atrás** — trapézio sai como chapéu de papel.

     A tela é **escura**, e isso não é escolha de arte: é o que o print de
     produção mostra
     (`manuais/traducao-cardapio-presencial/imagens-puras/09-tablet-coca-traduzida.png`).
     Barra de topo com logo, `SEARCH` e as duas ações em vermelho; coluna de
     atalhos com as bandeiras **retangulares** no pé; coluna de setores; e
     cartões deitados com foto à esquerda, preço em amarelo e botão `Order`.

     As fotos saem de um recorte do próprio print, feito por um
     `preparar-telas.py` na pasta do carrossel — este modelo vai sem imagem
     para renderizar sozinho.

     A tela é desenhada, então o slide leva `.selo-ilustracao`. O selo cai no
     canto de baixo à esquerda, fora da silhueta do aparelho. -->
<div class="slide slide--suave">
  <div class="topo">
    <span class="logo"></span>
    <span class="contador">4 de 7</span>
  </div>

  <div class="pilha g24" style="margin-top: 50px; max-width: 900px">
    <span class="chapeu">E na mesa também</span>
    <h2 class="titulo titulo--pequeno">
      Título de uma linha&nbsp;&#127482;&#127480;
    </h2>
    <p class="corpo">
      Até três linhas de corpo, largura cheia — o aparelho está embaixo, não ao
      lado.
    </p>
  </div>

  <span class="selo-ilustracao" style="left: 88px; top: 1262px">Ilustração</span>

  <div class="figura" style="margin-top: 52px; width: 880px">
    <div class="tablet" style="width: 880px">
      <div class="tablet__tela">
        <div class="tela-tablet" style="font-size: 19px">
          <div class="tela-tablet__topo">
            <span class="tela-tablet__logo"></span>
            <span class="tela-tablet__busca"><i class="lupa"></i>SEARCH</span>
            <span class="tela-tablet__acao"><i></i>MY CART</span>
            <span class="tela-tablet__acao"><i></i>MY BILL</span>
          </div>
          <div class="tela-tablet__miolo">
            <div class="tela-tablet__atalhos">
              <div class="tela-tablet__atalho"><i></i>HIGHLIGHTS</div>
              <div class="tela-tablet__atalho tela-tablet__atalho--ativo">
                <i class="talher"></i>MENU
              </div>
              <div class="tela-tablet__atalho"><i class="sino"></i>RATE</div>
              <div class="tela-tablet__idiomas">
                <span class="bandeira bandeira--retangular"><span>&#127463;&#127479;</span></span>
                <span class="bandeira bandeira--retangular bandeira--anel"><span>&#127482;&#127480;</span></span>
                <span class="bandeira bandeira--retangular"><span>&#127466;&#127480;</span></span>
              </div>
            </div>
            <div class="tela-tablet__setores">
              <div class="tela-tablet__setor tela-tablet__setor--ativo">Drinks</div>
              <div class="tela-tablet__setor">Molhos adicionais</div>
            </div>
            <div class="tela-tablet__corpo">
              <!-- A faixa continua em português: o título vem do Nome Público
                   do setor, e esse não troca de idioma. -->
              <div class="tela-tablet__faixa">Bebidas</div>

    </div>
  </div>
