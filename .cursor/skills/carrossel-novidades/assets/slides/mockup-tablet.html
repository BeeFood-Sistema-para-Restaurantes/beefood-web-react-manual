<!-- Modelo: Cardápio Digital no Tablet, tela deitada em suporte de mesa.

     Sozinho na faixa, vai em `.figura`: centralizado, reto e no maior tamanho
     que couber. Em 880 px de largura a altura total é 645 px (tela 593 + haste
     40 + pé 12), e sobra chão com chapéu + título de 1 linha + 4 linhas de
     corpo acima.

     O que faz ler "tablet" e não "monitor de mesa" mora no `base.css` e vale
     não mexer: moldura proporcional e igual nos quatro lados, canto bem
     arredondado, suporte pequeno atrás e o ponto da câmera no meio da moldura
     da esquerda.

     A tela é desenhada, então o slide leva `.selo-ilustracao`. O selo cai no
     canto de baixo à esquerda, fora da silhueta do aparelho. -->
<div class="slide slide--suave">
  <div class="topo">
    <span class="logo"></span>
    <span class="contador">4 de 7</span>
  </div>

  <div class="pilha g24" style="margin-top: 50px; max-width: 900px">
    <span class="chapeu">E na mesa também</span>
    <h2 class="titulo titulo--pequeno">
      Título de uma linha&nbsp;&#127482;&#127480;
    </h2>
    <p class="corpo">
      Até quatro linhas de corpo, largura cheia — o aparelho está embaixo, não
      ao lado.
    </p>
  </div>

  <span class="selo-ilustracao" style="left: 88px; top: 1246px">Ilustração</span>

  <div class="figura" style="margin-top: 44px; width: 880px">
    <div class="tablet" style="width: 880px">
      <div class="tablet__tela">
        <div class="tela-tablet" style="font-size: 23px">
          <!-- Coluna clara à esquerda, com as bandeiras no pé dos atalhos. -->
          <div class="tela-tablet__coluna">
            <div class="tela-tablet__aba tela-tablet__aba--ativa">DESTAQUES</div>
            <div class="tela-tablet__aba">CARDÁPIO</div>
            <div class="tela-tablet__aba">AVALIE</div>
            <div class="tela-tablet__idiomas">
              <span class="bandeira"><span>&#127463;&#127479;</span></span>
              <span class="bandeira bandeira--anel"><span>&#127482;&#127480;</span></span>
              <span class="bandeira"><span>&#127466;&#127480;</span></span>
            </div>
          </div>
          <div class="tela-tablet__corpo">
            <!-- Texto do app: só o que o manual documenta em inglês. -->
            <div class="tela-tablet__barra">
              <b>MESA 2</b><span>SEARCH</span><span>MY CART</span><span>MY BILL</span>
            </div>
            <div class="tela-tablet__capa"></div>
            <div class="tela-tablet__grade">
              <div class="tela-tablet__item">
                <div class="tela-tablet__foto"></div>
                <div class="tela-tablet__texto">
                  <span>Cola US</span><small>The drink cola</small>
                </div>
              </div>
              <div class="tela-tablet__item">
                <div class="tela-tablet__foto tela-tablet__foto--verde"></div>
                <div class="tela-tablet__texto">
                  <span>Geleia de Pimenta</span><small>Pote 30 g</small>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="tablet__haste"></div>
      <div class="tablet__pe"></div>
    </div>
  </div>
</div>
