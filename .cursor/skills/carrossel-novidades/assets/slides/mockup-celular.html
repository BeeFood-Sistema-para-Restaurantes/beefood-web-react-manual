<!-- Modelo: MOCKUP DE CELULAR (um ou dois aparelhos lado a lado).
     A moldura é CSS: o print entra inteiro, sem perder nitidez, e sem precisar
     de script de montagem. Capture com `--dispositivo celular` (390x844 @3x).
     Dois aparelhos ainda leem bem no 4:5; três aperta. -->
<div class="slide">
  <div class="topo">
    <span class="logo"></span>
    <span class="data">4 de 7</span>
  </div>

  <div class="empurra"></div>

  <div class="pilha g40">
    <span class="chapeu">No celular do cliente</span>
    <h2 class="titulo titulo--pequeno">
      A etiqueta aparece <span class="destaque">antes</span> de ele pedir
    </h2>
    <div class="par">
      <div class="pilha g24 centro">
        <div class="celular">
          <div class="celular__tela">
            <img src="../imagens-puras/04-cardapio.png" alt="Cardápio digital">
          </div>
        </div>
        <span class="cartao__rotulo">No cardápio</span>
      </div>
      <div class="pilha g24 centro">
        <div class="celular">
          <div class="celular__tela">
            <img src="../imagens-puras/05-sacola.png" alt="Sacola">
          </div>
        </div>
        <span class="cartao__rotulo">Na sacola</span>
      </div>
    </div>
  </div>

  <div class="empurra"></div>

  <div class="rodape">
    <span class="pontos">
      <span></span><span></span><span class="on"></span><span></span>
    </span>
    <span>beefood.app</span>
  </div>
</div>
