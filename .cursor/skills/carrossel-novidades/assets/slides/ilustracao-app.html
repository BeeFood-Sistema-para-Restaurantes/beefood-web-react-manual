<!-- Modelo: ILUSTRAÇÃO DE TELA DE APLICATIVO.
     Último recurso, para tela que não dá para capturar: app Android (Garçom,
     Entregador, Tablet) não sobe no Cloud Agent. A ordem de preferência é
     sempre: captura real > print pedido ao dono > ilustração.

     Três condições, todas obrigatórias:
     1. o comportamento desenhado está escrito na novidade ou no manual;
     2. o desenho usa o vocabulário do carrossel (cartão arredondado, Mulish,
        cor da marca) e NÃO imita a interface real pixel a pixel;
     3. o slide leva o `.selo-ilustracao` — ilustração que passa por captura
        engana quem lê, e o repositório é público.

     Registre no roteiro.md o print que você pediu ao dono, para trocar depois. -->
<div class="slide slide--suave">
  <div class="topo">
    <span class="logo"></span>
    <span class="data">6 de 8</span>
  </div>

  <div class="pilha g24" style="margin-top: 50px; max-width: 880px">
    <span class="chapeu">E não para no balcão</span>
    <h2 class="titulo titulo--pequeno">
      O entregador <span class="destaque">confirma</span> antes de ir embora
    </h2>
    <p class="corpo">
      Duas linhas, largura cheia.
    </p>
  </div>

  <!-- O selo mora na coluna vazia à esquerda do aparelho. -->
  <span class="selo-ilustracao" style="left: 88px; top: 580px">Ilustração</span>

  <div class="sangria sangria--celular" style="top: 530px">
    <div class="celular">
      <div class="celular__tela">
        <div class="tela-app">
          <div class="tela-app__barra">
            <span>20:41</span>
            <span>Entregador</span>
          </div>
          <div class="tela-app__topo">
            <div class="tela-app__titulo">Pedido #32</div>
            <div>Rua das Acácias, 120</div>
          </div>
          <!-- Conteúdo empilhado a partir do topo: o terço de baixo do celular
               está fora do slide, então nada importante vai para lá. -->
          <div class="tela-app__corpo">
            <div class="tela-app__cartao">
              <div class="tela-app__linha"><span>1x Combo One Burger</span></div>
              <div class="tela-app__linha"><span>&bull; 1x Batata frita</span></div>
              <div class="tela-app__linha tela-app__linha--destaque">
                <span>&bull; 1x Coca Cola 350ml</span>
              </div>
            </div>
            <div class="tela-app__aviso">
              <div>Entregue <b>1x Coca Cola 350ml</b> junto com o pedido.</div>
              <div class="tela-app__botao">Confirmar entrega</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="empurra"></div>

  <div class="rodape">
    <span class="pontos">
      <span></span><span></span><span></span><span></span>
      <span></span><span class="on"></span><span></span><span></span>
    </span>
  </div>
</div>
