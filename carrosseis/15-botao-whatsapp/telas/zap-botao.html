<!-- A conversa como ela abre quando o cliente toca no botão: o WhatsApp da loja,
     a conversa ainda vazia e a mensagem JÁ ESCRITA no campo de envio.

     POR QUE DESENHADA, e não capturada: não há número de WhatsApp conectado na
     sandbox, então nenhuma conversa existe para fotografar. Mesmo motivo da #10
     e da #11.

     E O DESENHO É O CONTRÁRIO DOS DOIS ANTERIORES, de propósito. Em
     `zap-avisos.html` (#10) e `zap-rastreio.html` (#11) o que se lê é MENSAGEM
     RECEBIDA: balão branco, do lado da loja, com o aviso que o sistema mandou.
     Aqui não há mensagem recebida nenhuma, e não pode haver: o `wa.me/…?text=`
     abre a conversa com o texto no CAMPO DE ENVIO, ainda não enviado — o manual
     diz com todas as letras que "o cliente pode apagar e escrever outra".
     Desenhar um balão já enviado afirmaria que a mensagem sai sozinha, que é
     precisamente o que o produto não faz.

     Por isso a conversa aparece VAZIA. É a primeira conversa daquele cliente
     com aquela loja, e o que o botão entrega é o começo dela.

     NADA AQUI FOI ESCRITO À MÃO. O texto é o `href` que o botão da captura
     carrega, lido no `medidas.json` e decodificado — com `{loja}` já virado
     ONE STAND HAMBURGUERIA e `{link}` já virado o endereço da página. O nome e
     o logotipo são os da mesma loja. A forma (cabeçalho verde-escuro, papel de
     parede bege, campo branco arredondado e disco verde de enviar) é a do
     aplicativo, sem imitar pixel a pixel.

     A MEDIDA É 600 DE LARGURA, e não 760, porque a tela entra no slide com
     904 px: a 760 o texto do campo sai com 19 px na arte, que é legível na tela
     grande e some no feed. Em 600 a mesma tela sobe para 24 px, e a mensagem —
     que é o assunto do slide — passa a ser lida de longe. Tela desenhada se
     dimensiona pela largura em que vai aparecer, nunca pela que dá jeito. -->
