<!-- Slide 4: a mensagem. O fato do manual e duplo — variaveis (20, em tres
     grupos) e variacao automatica, o trecho entre chaves sorteado no envio.
     Os dois servem a mesma ideia de uso, e por isso vao num slide so: o
     cliente recebe um texto que parece escrito para ele.

     A prova e a variacao cadastrada, que mostra as chaves e a previa lado a
     lado. O Historico mostraria o texto ja sorteado, que seria ainda melhor —
     e traz nome e telefone de um cliente real, e este repositorio e publico. -->
