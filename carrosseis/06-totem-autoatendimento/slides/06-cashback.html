     o cliente traz; o cashback e o motivo de ele voltar.

     A tela escolhida e a da identificacao, e nao a da carteira. Sao duas, e as

     outra, ja na confirmacao, ele mostra o saldo e o botao de usar. A primeira
     e melhor aqui por dois motivos — e onde o programa aparece para o cliente
     que ainda nao tem saldo, que e a maioria de quem usa um totem pela
     primeira vez; e o recorte da segunda mostraria o nome e o telefone de
     teste que o roteiro de captura digita.

     O recorte pega o campo VAZIO de proposito, antes de qualquer digito. A
     faixa amarela e a prova, o `(00) 00000-0000` e o convite, e nenhum dado

     O 5% e da tela, e nao um exemplo nosso: o totem le o percentual que a loja
     configurou. Ele conversa com o R$ 1,20 do slide 7, que e 5% dos R$ 24,00 do

     A frase do credito ("quando a venda e quitada") vem do manual
     `cashback-configurar`: o saldo cai de madrugada, em pedido pago e
