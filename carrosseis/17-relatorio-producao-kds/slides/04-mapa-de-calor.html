<!-- Slide 4: a aba Tempo, e o mapa de calor dia × hora.

     O ÂNGULO é a escala da cozinha. Ela se monta no palpite de quem está lá
     dentro — "sexta à noite enche" —, e o palpite acerta o dia e erra a hora,
     que é justamente a informação que decide quantas pessoas entram às 18h e
     quantas às 21h.

     O TÍTULO DIZ "TEMPO", E NÃO "MAPA DE CALOR". Mapa de calor é o nome do
     gráfico; Tempo é o nome da aba, e é a palavra que o leitor vai achar no
     relatório. A revisão trocou, e a troca vale como regra: no molde "Nome: o
     que ele te dá", o nome é o do item que se clica.

     A IMAGEM É O MAPA RECORTADO NAS HORAS DE SERVIÇO, 16h às 23h. A tela pinta
     as 24, e as oito colunas de madrugada sairiam cinzas aqui, roubando
     largura da célula — que é onde mora o número que o título promete. O
     recorte acaba onde a afirmação do slide acaba.

     O CORPO PERDEU AS HORAS DO EXEMPLO na revisão. Ele dizia "sexta às 20h e
     quarta às 20h", que é a cozinha do exemplo, não a de quem lê; virou "o dia
     da semana cruza com a hora", que é o que a tela faz em qualquer loja.

     A ÚLTIMA FRASE DO CORPO É O USO, e não o recurso: o aperto ganha dia e
     hora, e é com eles que se monta a escala da semana seguinte. Sem essa
     frase o slide descreve um gráfico bonito; com ela, descreve uma decisão. -->
