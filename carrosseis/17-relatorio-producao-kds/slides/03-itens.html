<!-- Slide 3: a aba Itens, e a coluna que dá nome ao problema.

     O ÂNGULO é que o dono já desconfia de um prato. Todo mundo que tem cozinha
     tem um palpite sobre qual item segura a fila; o que falta não é a suspeita,
     é o nome e o tamanho da diferença. A coluna "vs loja" entrega os dois numa
     célula só.

     O TÍTULO USA O MOLDE DA CASA — nome da aba, dois-pontos, o que ela te dá —
     e a palavra da tela. "Média da sua loja" não é escolha de estilo: a coluna
     se chama "vs loja", e é essa a conta que ela faz.

     A IMAGEM É O RANKING INTEIRO, seis linhas, do mais demorado ao mais
     rápido, porque é a ordenação que prova a frase. Uma linha recortada
     mostraria um prato lento; a lista mostra a ESCALA entre eles, que é o que
     faz o dono escolher por onde começar.

     O CORPO NÃO CITA NENHUM DOS NÚMEROS da imagem, de propósito: o prato que
     segura a fila é outro em cada loja, e escrito aqui o exemplo viraria
     promessa de resultado nosso. Que o dado é de exemplo está dito uma vez,
     na legenda do post. -->
