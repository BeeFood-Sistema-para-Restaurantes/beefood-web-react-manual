<!-- A janela de um item, com a Linha do tempo e as Etapas. Imagem do slide 2.

     O slide afirma que a espera na fila e o preparo vêm separados. A prova
     disso não é o cabeçalho do relatório, que já traz as duas médias: é UM
     item, com os três horários que o KDS carimbou e as duas parcelas que saem
     deles. Média se discute; relógio, não.

     A ESTRUTURA é a da janela de verdade, na ordem dela: seta de voltar, nome
     do item e categoria, Excel e Imprimir, o X; depois "Linha do tempo" com os
     quatro marcos (Lançado, Preparo, Pronto, Entregue) e "Etapas" com os três
     quadros (ESPERA, PREPARO, TOTAL), em mm:ss como a tela escreve.

     FICARAM DE FORA "Opções", "Canal" e "Capturado em", que a janela de
     verdade traz embaixo. Não é fidelidade a menos: é que o slide tem 614 px
     de altura para imagem, e o que não serve à afirmação só diminui o que
     serve. O slide 6 mostra a outra janela inteira.

     Os NÚMEROS são do mesmo jogo da peça, e os relógios batem:

       20:14:06 até 20:26:41  = 12:35 de espera
       20:26:41 até 20:37:52  = 11:11 de preparo
       12:35 + 11:11          = 23:46, que é o TOTAL do quadro
       20:14:06 até 20:37:52  = 23:46, pelo relógio

     O item é o Burger Duplo Cheddar, que no ranking do slide 3 tem 21,5 min de
     média. Este pedido levou 23:46 — acima da média dele, que é por isso que
     ele aparece em "Os mais lentos" no slide 6, com estes mesmos horários.

     AS ETAPAS SAEM SEM COR, como na tela. Pintar ESPERA de azul e PREPARO de
     vermelho faria o slide mais bonito e o produto, outro.

     A MEDIDA sai da altura disponível no slide, não do gosto: o miolo tem por
     volta de 600 px para imagem, e a faixa entra com 904 px de largura, então
     o fragmento não pode passar de 0,66 de altura sobre largura. 560x376 dá
     1,61x de escala, que é a faixa em que a #16 deixou a letra de interface
     legível no feed. O branco à direita da linha do tempo é da janela de
     verdade, não falta de conteúdo — lá ela também ocupa só a coluna da
     esquerda. -->
<div class="tela" data-medida="560x376" style="background: #fff">

  <!-- ------------------------------------------------------- cabeçalho -->
  <div style="flex: none; display: flex; align-items: center; gap: 13px;
              padding: 12px 18px; border-bottom: 1px solid var(--pn-borda)">
    <span style="width: 30px; height: 30px; border-radius: 999px;
                 background: var(--pn-cinza-chip); display: flex;
                 align-items: center; justify-content: center;
                 font-size: 14px; color: var(--pn-suave)">&#8592;</span>
    <div style="flex: 1; min-width: 0">
      <div style="font-size: 17px; font-weight: 900">Burger Duplo Cheddar</div>
      <div style="margin-top: 2px; font-size: 11px; font-weight: 800;
                  letter-spacing: 0.6px; color: var(--pn-fraco)">HAMBÚRGUERES</div>
    </div>
    <span style="background: var(--pn-verde); color: #fff; border-radius: 8px;
                 padding: 7px 12px; font-size: 12px; font-weight: 800">&#8681; Excel</span>
    <span style="border: 1px solid var(--pn-borda); border-radius: 8px;
                 padding: 7px 12px; font-size: 12px; font-weight: 800;
                 color: var(--pn-suave)">&#9113; Imprimir</span>
    <span style="font-size: 15px; color: var(--pn-fraco)">&#10005;</span>
  </div>

  <div style="flex: 1; padding: 12px 18px 14px; display: flex;
              flex-direction: column; gap: 12px; min-height: 0">

    <!-- ----------------------------------------------- linha do tempo -->
    <div>
      <div style="font-size: 15px; font-weight: 900">Linha do tempo</div>

      <!-- Cada marco é uma bolinha com um fio descendo até o próximo. O fio é
           um ::before não dá aqui (fragmento sem CSS próprio), então ele é um
           span absoluto dentro da linha. -->
      <div style="margin-top: 10px; display: flex; flex-direction: column">

        <div style="position: relative; padding: 0 0 9px 24px">
          <span style="position: absolute; left: 0; top: 3px; width: 11px; height: 11px;
                       border-radius: 999px; border: 2px solid var(--pn-verde);
                       background: #fff"></span>
          <span style="position: absolute; left: 5px; top: 16px; width: 1px;
                       bottom: 0; background: var(--pn-borda)"></span>
          <div style="font-size: 13px; font-weight: 800; line-height: 1.1">Lançado</div>
          <div style="margin-top: 2px; font-size: 13px; font-weight: 700;
                      color: var(--pn-suave); font-variant-numeric: tabular-nums">
            18/10/2026 20:14:06</div>
        </div>

        <div style="position: relative; padding: 0 0 9px 24px">
          <span style="position: absolute; left: 0; top: 3px; width: 11px; height: 11px;
                       border-radius: 999px; border: 2px solid var(--pn-verde);
                       background: #fff"></span>
          <span style="position: absolute; left: 5px; top: 16px; width: 1px;
                       bottom: 0; background: var(--pn-borda)"></span>
          <div style="font-size: 13px; font-weight: 800; line-height: 1.1">Preparo</div>
          <div style="margin-top: 2px; font-size: 13px; font-weight: 700;
                      color: var(--pn-suave); font-variant-numeric: tabular-nums">
            18/10/2026 20:26:41</div>
        </div>

        <div style="position: relative; padding: 0 0 9px 24px">
          <span style="position: absolute; left: 0; top: 3px; width: 11px; height: 11px;
                       border-radius: 999px; border: 2px solid var(--pn-verde);
                       background: #fff"></span>
          <span style="position: absolute; left: 5px; top: 16px; width: 1px;
                       bottom: 0; background: var(--pn-borda)"></span>
          <div style="font-size: 13px; font-weight: 800; line-height: 1.1">Pronto</div>
          <div style="margin-top: 2px; font-size: 13px; font-weight: 700;
                      color: var(--pn-suave); font-variant-numeric: tabular-nums">
            18/10/2026 20:37:52</div>
        </div>

        <div style="position: relative; padding: 0 0 0 24px">
          <span style="position: absolute; left: 0; top: 3px; width: 11px; height: 11px;
                       border-radius: 999px; border: 2px solid var(--pn-fraco);
                       background: #fff"></span>
          <div style="font-size: 13px; font-weight: 800; line-height: 1.1">Entregue</div>
          <div style="margin-top: 2px; font-size: 13px; font-weight: 700;
                      color: var(--pn-suave); font-variant-numeric: tabular-nums">
            18/10/2026 20:41:30</div>
        </div>
      </div>
    </div>

    <!-- ------------------------------------------------------- etapas -->
    <div>
      <div style="font-size: 15px; font-weight: 900">Etapas</div>
      <div style="margin-top: 9px; display: grid;
                  grid-template-columns: repeat(3, 1fr); gap: 11px">
        <div style="border: 1px solid var(--pn-borda); border-radius: 12px;
                    padding: 11px 14px">
          <div style="font-size: 11px; font-weight: 800; letter-spacing: 0.7px;
                      color: var(--pn-fraco)">ESPERA</div>
          <div style="margin-top: 3px; font-size: 24px; font-weight: 900;
                      font-variant-numeric: tabular-nums">12:35</div>
        </div>
        <div style="border: 1px solid var(--pn-borda); border-radius: 12px;
                    padding: 11px 14px">
          <div style="font-size: 11px; font-weight: 800; letter-spacing: 0.7px;
                      color: var(--pn-fraco)">PREPARO</div>
          <div style="margin-top: 3px; font-size: 24px; font-weight: 900;
                      font-variant-numeric: tabular-nums">11:11</div>
        </div>
        <div style="border: 1px solid var(--pn-borda); border-radius: 12px;
                    padding: 11px 14px">
          <div style="font-size: 11px; font-weight: 800; letter-spacing: 0.7px;
                      color: var(--pn-fraco)">TOTAL</div>
          <div style="margin-top: 3px; font-size: 24px; font-weight: 900;
                      font-variant-numeric: tabular-nums">23:46</div>
        </div>
      </div>
    </div>
  </div>
</div>
