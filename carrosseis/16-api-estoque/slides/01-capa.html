     letras: "slide 1 -> idem ao outro carrossel que já fizemos, mostrando MCP".
     Arco de cinco quadrados, pílula, título grande centrado, linha de apoio e
     a lista de tiques, nessa ordem — que é a ordem da folha *Aplicativos → MCP*
     no painel.

     A primeira versão desta peça abriu com a CONVERSA DESENHADA, e esse era o
     erro de forma: na #13 a conversa é a PROVA do miolo, não a capa. Promover a
     prova a capa gasta na primeira página a imagem que o slide 3 precisa, e
     ainda faz as duas peças da família abrirem diferente sem motivo.

     O TÍTULO mudou, e o que caiu nele foi a palavra "API". A versão anterior
     dizia "API de Estoque: a sua IA responde o que está acabando" — nome de
     venda inventado por nós, e inventado do lado errado: "API" é como o
     desenvolvedor chama a coisa. Quem rola o feed tem um restaurante, e para
     ele a coisa se chama **Estoque**, que é o nome do módulo no menu.

     O molde é AFIRMAÇÃO DO FATO, com o sujeito certo: o que mudou é que agora
     dá para cuidar do estoque conversando. "Agora dá" é o que o leitor
     precisa saber, "Estoque" é a palavra que ele vai procurar, e "conversando"
     é a novidade — porque o módulo já existia e a conversa não chegava nele.

     Os QUATRO TIQUES são o bloco de benefícios da folha, reescritos para este
     recurso, e os três primeiros são exatamente o que os slides 3 e 4 provam.
     O quarto nomeia as ferramentas e, na mesma linha, a segunda porta — que é a
     da API Aberta, do sistema do parceiro. -->
