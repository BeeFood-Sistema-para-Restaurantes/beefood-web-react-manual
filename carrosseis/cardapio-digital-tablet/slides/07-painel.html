<!-- O slide do dono, e o unico da peca em que ele aparece inteiro: dez, vinte
     aparelhos ligados no salao viram uma tela so. A pagina chama isso de
     "controle todos os tablets em uma unica tela", e o painel entrega
     exatamente isso — contadores em cima, um cartao por aparelho embaixo.

     A frota vem do `tablets.json`, porque o sandbox tem UM aparelho, offline e
     sem mesa: o recurso esta ligado e a vitrine e que falta. Os campos sao os
     do aparelho de verdade, e quem conta os cinco numeros, pinta o status pelo
     ultimo sinal e escolhe o icone de bateria e o painel.

     O texto nao fala de travar o tablet. Existem duas travas com o mesmo nome
     — o `TRAVAR` do painel, que bloqueia so o botao voltar, e o modo kiosk,
     que se liga no proprio aparelho — e uma linha so nao separa as duas. Quem
     precisa da trava tem o manual. -->
<div class="slide slide--suave">
  <div class="topo">
    <span class="logo"></span>
    <span class="contador">7 de 8</span>
  </div>

  <div class="pilha g24" style="margin-top: 30px; max-width: 920px">
    <span class="chapeu">No seu painel</span>
    <h2 class="titulo titulo--pequeno">
      O salão inteiro cabe em uma <span class="destaque">tela</span>
    </h2>
    <p class="corpo">
      Cada aparelho mostra a mesa em que está, a bateria e há quanto tempo deu
      sinal. Mudou o cardápio? Um envio atualiza todos os tablets do salão de
      uma vez.
    </p>
  </div>

  <div class="figura" style="margin-top: 44px; width: 860px">
    <div class="recorte">
      <img src="../imagens-puras/frota.png"
           alt="Painel Cardápio no Tablet: contadores de contratados, total, online, ausentes e offline, e seis cartões de aparelho, um por mesa, com bateria, tempo desde o último sinal e versão">
    </div>
  </div>

  <div class="empurra"></div>

  <div class="rodape">
    <span class="pontos">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span class="on"></span><span></span>
    </span>
    <span class="arraste">arraste</span>
  </div>
</div>
