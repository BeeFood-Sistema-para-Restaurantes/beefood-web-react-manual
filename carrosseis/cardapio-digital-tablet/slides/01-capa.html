<!-- A capa nomeia o recurso na pilula e diz na manchete o que ele faz. O
     sujeito e a MESA, e nao o aparelho: e isso que separa este canal do totem
     (que fica na entrada e resolve um pedido) e do QR Code (que vive no
     celular do cliente). O tablet fica, e acompanha a refeicao inteira — da
     primeira rodada ate a conta.

     "conta" e a palavra em vermelho porque e o fim do caminho, e e o que
     ninguem espera que a mesa resolva sozinha.

     O subtitulo veio da propria pagina, que promete "o cliente so chama o
     garcom se quiser", dito com as nossas palavras.

     A imagem e o PRINT DE PRODUCAO do aplicativo, e nao um desenho: o
     aplicativo e Android e nao roda aqui, entao o primeiro degrau da ancoragem
     nao existe e o segundo e o print que o dono mandou para o manual do modo
     kiosk. Ele tem 2560x1600 — 16/10, exatamente a proporcao da tela do
     mockup, entao entra inteiro, sem corte lateral.

     Sangria pela base, centralizada e reta: o aparelho esta sozinho na faixa,
     e girar em 3D so tiraria tamanho. -->
