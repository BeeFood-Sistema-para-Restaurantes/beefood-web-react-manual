<!-- A capa ANUNCIA: o nome do recurso no titulo, o que ele faz no subtitulo.

     Molde: ANTES x AGORA, e e o primeiro uso dele na serie. Placar das dez
     capas anteriores: pergunta 2, afirmacao do fato 5, anuncio de chegada 1,
     nome + canal 1, nome + dois-pontos 1, antes x agora 0.

     Nao entrou por rodizio. O recurso E um antes e um agora da MESMA mensagem:
     a loja nao passou a mandar nada novo, o aviso que ja saia ganhou um bloco
     no fim. E o antes e o da mensagem, que e do produto — "Antes, o telefone.
     Agora, o rastreio" afirmaria que os clientes dele ligam, e quem poderia
     desmentir isso e ele.

     O destaque cai sobre o nome inteiro, como na #8, na #9 e na #10.

     desenhou o Leaflet, o pino, a moto e a barra. O celular sangra pela base,
