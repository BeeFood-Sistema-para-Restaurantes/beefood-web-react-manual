<!-- Slide 9: o CTA.

     ESTE SLIDE FOI REFEITO INTEIRO, copy e imagem, e o retorno foi de uma
     linha: *"não é sobre isso, venda a novidade"*.

     Ele estava certo, e o defeito é fácil de descrever: as duas versões
     anteriores eram sobre CADASTRO. A primeira mostrava a janela que ensina
     onde criar o funcionário e o usuário; a segunda trocou a imagem e manteve
     o assunto ("dois cadastros que você já tem"). Nenhuma das duas vende o
     módulo — as duas explicam a burocracia de ligá-lo, que é trabalho, não
     motivo. Fechar peça de novidade com trabalho é perder a venda no último
     slide.

     O que a série faz em CTA de novidade, e que esta peça tinha abandonado:
     chapéu "Já está no ar", título no imperativo com "hoje", subtítulo com o
     primeiro passo mais a linha de fechamento da casa, e a pílula de caminho.
     É assim na #3 ("Suba o seu primeiro vídeo hoje"), na #4 ("Ligue o primeiro
     ajuste hoje") e na #8 ("Abra o painel e deixe ligado hoje") — que é a peça
     irmã, do mesmo módulo.

     A linha de disponibilidade é fato publicado, não promessa nossa: a novidade
     do Painel para Entregadores diz que ele "está incluso no módulo Entrega,
     junto da Gestão de Entregas". Por isso a frase é condicional — quem TEM o
     módulo Entrega já tem isto — em vez de "todo mundo já tem".

     O caminho mudou de `Aplicativos → Entrega → BeeFood Entregador` para
     `Delivery → Entregas`: o CTA aponta para o módulo que a peça vendeu, e não
     para o aplicativo, que é assunto de um slide do meio.

     A IMAGEM também trocou, pelo teste de imagem da revisão: a primeira era o
     aplicativo VAZIO, com "Nenhuma entrega agora", e ela só existia porque a
     copy velha precisava dela ("lista vazia é sinal de que deu certo"). Tela em
     que não acontece nada é a pior arte possível para fechar uma venda.

     A SEGUNDA tentativa foi a lista de rotas cortada, e ela provava o título —
     mas de perto demais. Ficou o MAPA NO NOTEBOOK, o mesmo da capa, no mesmo
     lugar e no mesmo tamanho: a peça abre e fecha na mesma cena, e o último
     slide devolve inteira a imagem que fez o leitor parar de rolar. A capa
     apresenta a tela; aqui ela volta com um imperativo em cima.

     Repetir a arte da capa no CTA não é economia, é forma: o leitor que chegou
     ao nono slide vê de novo o que quer ter, agora sabendo ler cada coisa dali
     — a rota A tracejada, as paradas numeradas, o Diego e o Marcos com nome no
     mapa. É o único slide da peça em que repetir prova é a decisão certa,
     porque o assunto dele é justamente "abra isto".

     A luz quente atrás é a mesma da capa, pelo mesmo motivo: sem ela o
