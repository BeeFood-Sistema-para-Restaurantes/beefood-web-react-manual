     responde "mas eu já não vejo meus pedidos?" sem virar manual e sem virar
     história.

     A imagem é o painel inteiro, e é de propósito que ela entre INTEIRA: o

     fica com ~10 px de letra —, e ele se paga porque o que precisa ser lido
     aqui é a divisão da tela e o nome de quem leva, não o endereço de cada
     pedido. Esse detalhe é o slide 4. -->
