     Agent.

     Por que ESTA tela no CTA: antes o slide 9 usava a janela do painel que
     ensina os dois cadastros — "criar um funcionário em Cadastro → Funcionário,
     criar um usuário em Configuração → Usuário". Isso é tela de instrução, que
     é o que a regra nova do passo 3 da SKILL.md tirou da arte. O resultado dos
     dois cadastros é este: o entregador entra, a pílula fica verde, e a lista
     está vazia porque ainda não despacharam nada para ele. O manual é explícito
     de que a tela assim "é sinal de que deu tudo certo, não de problema"
     (manuais/app-entregador-entrar/, seção 3) — e é isso que faz uma tela vazia
     poder ser a imagem de um CTA.

     Copia layout, paleta e hierarquia de um print de PRODUÇÃO, sem recortar
     nada dele:
       manuais/gestao-entregas/material-recebido/app-entregador/
         02-disponibilidade/prints/02-pilula-pausa.png
     que é a mesma tela com a pílula laranja. O verde do ONLINE é o de
     manuais/app-entregador-entrar/imagens-puras/10-tres-pilulas.png.

     390x844 é a medida do `.celular`, e ele entra no slide com ~620 px.

     Uma diferença do print, e é de enquadramento: no aparelho o bloco vazio
     fica no meio da tela, com muito branco em cima. O slide sangra pela base e
     mostra só a metade de cima do aparelho, então ali o bloco subiu — senão o
     que o leitor vê é um retângulo branco. Nada do conteúdo mudou. -->
