<!-- Capa: a pergunta é retórica e quem responde é a imagem. O totem mostra o
     cardápio DRINKS com "Cola US / The drink cola" — a resposta está na tela,
     não no texto.

     Aqui a tela é o cardápio, e não a tela de espera com o seletor, que foi a
     primeira tentativa. A de espera é mais icônica (botão vermelho e três
     bandeiras), mas o miolo dela é um gradiente: sobrava um vão morto de 300 px
     no meio da capa. O cardápio enche a tela e prova a frase. O seletor ganhou
     o slide 3, onde uma coluna de texto equilibra o vão.

     MOLHOS ADICIONAIS fica em português na capa de propósito. Dilui um pouco o
     "fala inglês", e mesmo assim entra: é o comportamento real (setor sem
     tradução não fica em branco) e é o que o slide 6 explica. Capa que promete
     mais do que o produto entrega volta como reclamação.

     Totem centralizado e no maior tamanho que couber, porque está sozinho na
     faixa (MEMORIA-CARROSSEIS.md, "Onde a imagem fica na faixa"). É a coluna
     que faz ler "totem" em vez de "celular gigante", e o pé sai pela base de
     propósito: a borda de baixo do slide lê como chão, e aparelho em pé com o
     pé inteiro no meio do slide parece recortado e colado.

     O subtítulo tem UMA linha. Aparelho em pé come 830 px de altura, e com duas
     linhas de subtítulo o totem começava dentro do texto.

     Carcaça clara (`.totem--claro`, modelo que existe no catálogo) porque o
     slide é escuro: na primeira tentativa o totem preto sumiu no fundo preto. -->
<div class="slide slide--capa">
  <div class="topo">
    <span class="logo"></span>
    <span class="contador">1 de 7</span>
  </div>

  <div class="pilha g24" style="margin-top: 36px">
    <span class="pilula pilula--novidade">Novidade</span>
    <h1 class="titulo">Seu cardápio já fala <span class="destaque">inglês</span>?</h1>
    <p class="subtitulo">
      Agora fala — e espanhol também.
    </p>
  </div>

  <span class="selo-ilustracao" style="right: 88px; top: 1230px">Ilustração</span>

  <div class="sangria" style="top: 552px; right: 330px; width: 420px">
    <div class="totem totem--claro" style="width: 420px">
      <div class="totem__tela">
        <div class="tela-totem" style="font-size: 22px">
          <div class="tela-totem__topo">
            <span class="tela-totem__acao">CANCEL ORDER</span>
            <span class="tela-totem__idiomas tela-totem__idiomas--topo">
              <span class="bandeira"><span>&#127463;&#127479;</span></span>
              <span class="bandeira bandeira--anel"><span>&#127482;&#127480;</span></span>
              <span class="bandeira"><span>&#127466;&#127480;</span></span>
            </span>
          </div>
          <div class="tela-totem__secao">DRINKS</div>
          <div class="tela-totem__lista">
            <div class="tela-totem__item">
              <span>Cola US</span><small>The drink cola</small><b>R$ 8,90</b>
            </div>
          </div>
          <div class="tela-totem__secao tela-totem__secao--sem-traducao">
            MOLHOS ADICIONAIS
          </div>
          <div class="tela-totem__lista">
            <div class="tela-totem__item">
              <span>Geleia de Pimenta</span><small>Pote 30 g</small><b>R$ 3,00</b>
            </div>
            <div class="tela-totem__item">
              <span>Molho verde</span><small>Porção</small><b>R$ 2,00</b>
            </div>
          </div>
        </div>
      </div>
      <div class="totem__coluna"></div>
      <div class="totem__pe"></div>
    </div>
  </div>

  <div class="empurra"></div>

  <div class="rodape">
    <span class="arraste">Arraste &rarr;</span>
  </div>
</div>
