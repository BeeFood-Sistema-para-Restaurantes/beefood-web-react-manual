<!-- A escolha do idioma na tela de espera do totem: é onde o seletor aparece. A
     capa já mostrou o resultado (o cardápio em inglês); aqui é o gesto.

     Totem **reto**, sem 3D. O giro funciona em celular e em computador, que são
     aparelhos que a gente vê de todos os ângulos; um totem é um armário em pé,
     e girado ele lê como armário tombando. A regra virou linha na
     MEMORIA-CARROSSEIS.md: 3D só em celular e em janela de computador.

     A tela é a de espera, copiada do print de produção (07): fundo cinza claro,
     o botão vermelho no meio com o fio branco em volta, e a pílula branca com
     as três bandeiras logo embaixo. Brasil marcado, que é o estado antes de o
     cliente escolher. Nada mais está escrito ali porque nada mais está escrito
     no aparelho.

     O texto fica na esquerda, em coluna estreita, e o totem sobe até a faixa do
     título: aparelho em pé pede altura, e a coluna sai pela base. -->
