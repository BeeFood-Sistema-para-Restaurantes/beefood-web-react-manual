<!-- A escolha do idioma, na tela de espera do totem: é onde o seletor aparece.
     A capa já mostrou o resultado (o cardápio em inglês); aqui é o gesto.

     Único slide em 3D do carrossel,
     porque é o único em que o aparelho divide a faixa com uma coluna de texto —
     é essa coluna que dá licença para girar (MEMORIA-CARROSSEIS.md, "Mockup 3D").
     Giro para dentro: a quina que aponta para o texto é a que afunda.

     A tela é desenhada, e a única coisa escrita nela é o que o manual afirma: o
     botão em português com o seletor embaixo, e o Brasil marcado — é assim que a
     tela de espera aparece antes de o cliente escolher.

     Texto em quatro linhas, não seis: a coluna tem 420 px, e com seis o texto
     encostava no selo de ilustração. -->
<div class="slide slide--suave">
  <div class="topo">
    <span class="logo"></span>
    <span class="contador">3 de 7</span>
  </div>

  <div class="pilha g24" style="margin-top: 50px; max-width: 880px">
    <span class="chapeu">No totem</span>
    <h2 class="titulo titulo--pequeno">
      Ele escolhe o idioma <span class="destaque">antes</span> de pedir
    </h2>
    <p class="corpo" style="max-width: 420px">
      Elas ficam embaixo do botão de começar. E dá para trocar no meio do
      pedido também.
    </p>
  </div>

  <span class="selo-ilustracao" style="left: 88px; top: 706px">Ilustração</span>

  <div class="sangria cena3d" style="top: 296px; right: 40px; width: 462px">
    <div class="totem g3d g3d--na-direita" style="width: 462px">
      <div class="totem__tela">
        <div class="tela-totem tela-totem--espera" style="font-size: 23px">
          <div class="tela-totem__marca">Seu restaurante</div>
          <div class="tela-totem__botao">FAÇA SEU PEDIDO</div>
          <div class="tela-totem__idiomas" style="font-size: 2.9em">
            <span class="bandeira bandeira--anel"><span>&#127463;&#127479;</span></span>
            <span class="bandeira"><span>&#127482;&#127480;</span></span>
            <span class="bandeira"><span>&#127466;&#127480;</span></span>
          </div>
        </div>
      </div>
      <div class="totem__coluna"></div>
      <div class="totem__pe"></div>
    </div>
  </div>
</div>
