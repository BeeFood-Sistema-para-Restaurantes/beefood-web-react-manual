<!-- A capa diz o fato com os tres eixos da novidade, e nao um exemplo dela.
     A primeira versao desta peca abriu com "De 5% de desconto no Pix" — que e
     literalmente o primeiro exemplo do release — e entregou um quarto do
     recurso: sem o acrescimo e sem o ajuste em reais.

     Molde: afirmacao. A ordem direta nao cabe aqui, porque verbo obriga a
     escolher um objeto, e o objeto deste recurso e um par (descontar ou
     acrescer). Escolher um lado e jogar metade fora.

     A imagem carrega os eixos junto com o texto: e a gaveta de formas do
     cliente, com selo verde de desconto no PIX e no dinheiro (um em %, outro em
     R$) e selo vermelho de acrescimo no credito. Um total abatido mostraria um
     sentido so. -->
<div class="slide slide--capa">
  <div class="topo">
    <span class="logo"></span>
    <span class="contador">1 de 7</span>
  </div>

  <div class="pilha g24" style="margin-top: 36px; max-width: 920px">
    <span class="pilula pilula--novidade">Novidade</span>
    <h1 class="titulo">
      Cada forma de pagamento com o seu <span class="destaque">preço</span>
    </h1>
    <!-- Uma linha, porque o aparelho em pé come o resto da altura. O título
         leva três: o aparelho desce para 672 px e afina para 550, e nessa
         medida o selo de acréscimo do crédito ainda cabe dentro do slide. -->
    <p class="subtitulo">
      Desconto ou acréscimo, em reais ou em %.
    </p>
  </div>

  <div class="sangria" style="top: 672px; left: 50%; transform: translateX(-50%);
                              width: 550px">
    <div class="celular" style="width: 550px">
      <div class="celular__tela">
        <img src="../imagens-puras/formas-lista.png"
             alt="Formas de pagamento no cardápio: PIX com 5% de desconto, dinheiro com R$ 3,00 de desconto e cartão de crédito com 2% de acréscimo">
      </div>
    </div>
  </div>
</div>
