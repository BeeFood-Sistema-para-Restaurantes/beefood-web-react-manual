<!-- A capa NOMEIA o recurso. As duas versoes anteriores nao nomeavam: a
     primeira era o exemplo do release promovido a manchete ("De 5% de desconto
     no Pix") e a segunda era conceito ("Cada forma de pagamento com o seu
     preco") — bonita, com os tres eixos, e sem dizer o nome de nada. Quem le
     so a capa tem de saber o que entrou no sistema.

     Molde: nome do recurso, que e o quinto da lista e o que serve quando a
     novidade cria uma capacidade nova. Ordem direta nao cabe aqui (verbo
     obriga a escolher um objeto, e o objeto deste recurso e um par) e
     afirmacao ja tinha sido gasta pela peca anterior do perfil.

     Vermelho em "forma", que e a noticia: desconto o sistema ja tinha em
     cupom; por forma de pagamento, nao.

     Titulo em `titulo--medio`: em 92 px o nome do recurso quebra em quatro
     linhas e nao sobra slide para a imagem. A imagem carrega os eixos junto
     com o texto — selo verde de desconto no PIX e no dinheiro (um em %, outro
     em R$) e selo vermelho de acrescimo no credito. -->
<div class="slide slide--capa">
  <div class="topo">
    <span class="logo"></span>
    <span class="contador">1 de 7</span>
  </div>

  <div class="pilha g24" style="margin-top: 36px; max-width: 920px">
    <span class="pilula pilula--novidade">Novidade</span>
    <h1 class="titulo titulo--medio">
      Acréscimo e desconto por <span class="destaque">forma</span> de pagamento
    </h1>
    <p class="subtitulo">
      Em reais ou em %. O cliente vê o valor antes de confirmar o pedido.
    </p>
  </div>

  <div class="sangria" style="top: 560px; left: 50%; transform: translateX(-50%);
                              width: 620px">
    <div class="celular" style="width: 620px">
      <div class="celular__tela">
        <img src="../imagens-puras/formas-lista.png"
             alt="Formas de pagamento no cardápio: PIX com 5% de desconto, dinheiro com R$ 3,00 de desconto e cartão de crédito com 2% de acréscimo">
      </div>
    </div>
  </div>
</div>
