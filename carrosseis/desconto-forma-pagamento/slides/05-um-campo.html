<!-- A régua. O slide não ensina a cadastrar: ele mostra que a escolha entre
     porcentagem e valor fixo é uma decisão de margem, e a lista aberta prova
     que as quatro combinações existem num campo só.

     O recorte é colado nas bordas da própria lista. Mais largo, entra o botão
     vermelho de salvar cortado no meio da palavra e a página escurecida atrás
     do modal — e os dois disputam o olho com o que interessa. -->
<div class="slide slide--suave">
  <div class="topo">
    <span class="logo"></span>
    <span class="contador">5 de 7</span>
  </div>

  <div class="pilha g24" style="margin-top: 30px; max-width: 920px">
    <span class="chapeu">A régua é sua</span>
    <h2 class="titulo titulo--pequeno">
      Ajuste em <span class="destaque">reais</span> ou em porcentagem
    </h2>
    <p class="corpo">
      R$ 3,00 fixos chamam mais atenção no pedido pequeno; 5% pesam mais no
      combo de família. Escolha a régua de cada forma pela sua margem, e ela
      passa a valer em todo pedido.
    </p>
  </div>

  <div class="figura" style="margin-top: 36px">
    <div class="recorte" style="width: 520px">
      <img src="../imagens-puras/lista-ajuste.png"
           alt="Campo Ajuste no pagamento com a lista aberta: sem ajuste, desconto em porcentagem, desconto em reais, acréscimo em porcentagem e acréscimo em reais">
    </div>
  </div>
</div>
