<!-- O eixo que a capa da versao anterior deixou de fora: o ajuste tem duas
     reguas, valor fixo e porcentagem. As cinco opcoes do campo estao na
     captura, com a lista aberta — e a tela diz isso melhor que qualquer frase.

     Reto, e nao em 3D: e um dos dois slides em que o leitor le rotulo de
     interface, e a face que recua no `.g3d` come contraste justo ali.

     A imagem esta sozinha na faixa, entao vai centralizada e na maior largura
     que a base aceita. A janela de navegador entra porque isto e o painel, e
     nao o celular do cliente — o slide anterior era a tela dele. -->
<div class="slide">
  <div class="topo">
    <span class="logo"></span>
    <span class="contador">4 de 7</span>
  </div>

  <div class="pilha g24" style="margin-top: 34px; max-width: 900px">
    <span class="chapeu">No cadastro da forma</span>
    <h2 class="titulo titulo--pequeno">
      Escolha <span class="destaque">reais</span> ou porcentagem
    </h2>
    <p class="corpo">
      R$ 3,00 fixos pesam mais no pedido pequeno. A porcentagem acompanha o
      combo de família. O campo tem as duas réguas, e as duas vão nos dois
      sentidos.
    </p>
  </div>

  <div class="figura" style="margin-top: 46px">
    <div class="navegador" style="width: 904px">
      <div class="navegador__barra">
        <span class="navegador__bolinha"></span>
        <span class="navegador__bolinha"></span>
        <span class="navegador__bolinha"></span>
        <span class="navegador__url">beefood.app</span>
      </div>
      <!-- A captura vai inteira no arquivo puro e é o slide que escolhe onde
           ela termina: 514 px de 540 fecham logo depois da borda do menu. Nos
           26 px que sobram começa o rótulo DISPONIBILIDADE, e rótulo cortado
           no meio lê como falha de render. -->
      <div class="navegador__tela" style="aspect-ratio: 982 / 514;
                                          overflow: hidden">
        <img src="../imagens-puras/painel-ajuste.png"
             style="height: 100%; object-fit: cover; object-position: top center"
             alt="Campo Ajuste no pagamento aberto no painel, com as opções sem ajuste, desconto em porcentagem, desconto em reais, acréscimo em porcentagem e acréscimo em reais, e o valor de R$ 3,00 ao lado">
      </div>
    </div>
  </div>

  <div class="empurra"></div>

  <div class="rodape">
    <span class="pontos">
      <span></span><span></span><span></span><span class="on"></span>
      <span></span><span></span><span></span>
    </span>
    <span class="arraste">beefood.app</span>
  </div>
</div>
