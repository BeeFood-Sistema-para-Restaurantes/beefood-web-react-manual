<!-- O eixo que a pagina chama de gestao inteligente, dito com a palavra concreta:
     um cadastro, um preco por cardapio. A tela mostra os tres estados, e o
     terceiro (marmitaria desligada) e o que prova que a escolha e por cardapio,
     nao uma copia do produto em tres lugares.

     Recorte sem moldura: a tela ja e um pedaco de cadastro, e moldura de
     navegador em cima de recorte de cartao lê como tela dentro de tela. -->
<div class="slide">
  <div class="topo">
    <span class="logo"></span>
    <span class="contador">4 de 7</span>
  </div>

  <div class="pilha g24" style="margin-top: 26px; max-width: 900px">
    <span class="chapeu">Um cadastro só</span>
    <h2 class="titulo titulo--pequeno">
      Um produto, um preço por <span class="destaque">marca</span>
    </h2>
    <p class="corpo">
      O produto é cadastrado uma vez. Depois você escolhe em quais cardápios ele
      aparece, e quanto custa em cada um.
    </p>
  </div>

  <div class="figura" style="margin-top: 36px; width: 944px">
    <div class="recorte">
      <img src="../imagens-puras/produto-em-cardapios.png"
           alt="Cadastro da Batata Frita Grande com uma linha por cardápio: R$ 22,90 na Hamburgueria, R$ 24,90 na Pizzaria e desligada na Marmitaria">
    </div>
  </div>

  <div class="empurra"></div>

  <div class="rodape">
    <span class="pontos">
      <span></span><span></span><span></span><span class="on"></span>
      <span></span><span></span><span></span>
    </span>
    <span class="arraste">arraste</span>
  </div>
</div>
