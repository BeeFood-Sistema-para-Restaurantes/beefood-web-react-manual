<!-- A prova da peca, e ela e a tela: o painel de Delivery com pedido de iFood,
     99Food, Keeta, cardapio proprio e WhatsApp, e a etiqueta da marca em cada
     um. Os tres filtros de marca aparecem ligados porque o titulo diz que os
     pedidos chegam juntos — filtro ligado numa marca so mostraria o contrario.

     Em janela de navegador, que e o mockup de sistema web deitado, e ela entra
     INTEIRA no slide: com a janela sangrando pela direita, a quarta coluna
     ficava cortada no meio de um pedido, e coluna pela metade le como defeito de
     render. Por isso a tela desenhada tem tres colunas, nao as cinco do painel. -->
<div class="slide slide--suave">
  <div class="topo">
    <span class="logo"></span>
    <span class="contador">3 de 7</span>
  </div>

  <div class="pilha g24" style="margin-top: 26px; max-width: 880px">
    <span class="chapeu">Um painel</span>
    <h2 class="titulo titulo--pequeno">
      Os pedidos chegam todos na mesma <span class="destaque">tela</span>
    </h2>
    <p class="corpo">
      Marketplace, cardápio próprio e WhatsApp entram na mesma fila, e cada
      pedido chega com a marca dele.
    </p>
  </div>

  <div class="figura" style="margin-top: 60px; width: 944px">
    <div class="navegador">
      <div class="navegador__barra">
        <span class="navegador__bolinha"></span>
        <span class="navegador__bolinha"></span>
        <span class="navegador__bolinha"></span>
        <span class="navegador__url">beefood.app/delivery</span>
      </div>
      <div class="navegador__tela">
        <img src="../imagens-puras/pedidos-tres-marcas.png"
             alt="Painel de Delivery com as colunas Aguardando, Preparo, Pronto/Entrega e Entregue; cada pedido traz o canal e a etiqueta da marca">
      </div>
    </div>
  </div>
</div>
