<!-- O unico slide que troca de lado: os cinco anteriores sao o painel de quem
     opera, e este e a tela do cliente. E o Link Multilojas, que reune os
     cardapios numa pagina.

     Celular sangrando pela base, que e o mockup do cardapio publico em toda a
     colecao. A tela desenhada acaba antes do fim do aparelho de proposito: a
     base do celular sai do slide, e o vazio fica fora da arte.

     500 px de largura, e nao 600: o titulo diz "todas as marcas", e em 600 o
     terceiro cartao caia fora do slide. O aparelho menor e o preco de a
     promessa do titulo aparecer inteira. -->
<div class="slide slide--suave">
  <div class="topo">
    <span class="logo"></span>
    <span class="contador">6 de 7</span>
  </div>

  <div class="pilha g24" style="margin-top: 26px; max-width: 900px">
    <span class="chapeu">Do lado do cliente</span>
    <h2 class="titulo titulo--pequeno">
      Todas as marcas num link <span class="destaque">só</span>
    </h2>
    <p class="corpo">
      Um endereço para a bio do Instagram e para o WhatsApp. O cliente abre,
      escolhe a marca e pede.
    </p>
  </div>

  <div class="sangria" style="top: 470px; left: 50%; transform: translateX(-50%);
                              width: 500px">
    <div class="celular" style="width: 500px">
      <div class="celular__tela">
        <img src="../imagens-puras/link-multilojas.png"
             alt="Link multilojas no celular, com os cartões da Hamburgueria, da Pizzaria e da Marmitaria no mesmo endereço">
      </div>
    </div>
  </div>
</div>
