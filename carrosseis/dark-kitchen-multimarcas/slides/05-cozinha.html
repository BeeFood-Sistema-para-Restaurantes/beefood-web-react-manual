<!-- A cozinha, que e onde a operacao multimarca se resolve ou se perde: tres
     marcas saem da mesma chapa, e o pedido tem de dizer de qual e.

     O mockup e o tablet porque e onde o Monitor KDS fica de verdade — a foto de
     catalogo do proprio site mostra o tablet no suporte, na parede da cozinha.
     Nao e enfeite: aparelho errado num slide de cozinha vira ilustracao.

     A afirmacao "por marca e por setor" e da pagina, que e a empresa falando do
     proprio produto. Anotada como fonte no roteiro. -->
<div class="slide">
  <div class="topo">
    <span class="logo"></span>
    <span class="contador">5 de 7</span>
  </div>

  <div class="pilha g24" style="margin-top: 26px; max-width: 900px">
    <span class="chapeu">Na cozinha</span>
    <h2 class="titulo titulo--pequeno">
      A cozinha vê de qual marca é o <span class="destaque">pedido</span>
    </h2>
    <p class="corpo">
      O Monitor KDS separa por marca e por setor. Quem está na chapa vê o que é
      da chapa, com a marca escrita no pedido.
    </p>
  </div>

  <div class="figura" style="margin-top: 44px; width: 860px">
    <div class="tablet" style="width: 860px">
      <div class="tablet__tela">
        <img src="../imagens-puras/kds-marcas.png"
             alt="Monitor KDS com as colunas Em Espera, Em Preparo e Pronto; cada pedido traz a etiqueta da marca e do setor">
      </div>
      <div class="tablet__suporte"></div>
    </div>
  </div>

  <div class="empurra"></div>

  <div class="rodape">
    <span class="pontos">
      <span></span><span></span><span></span><span></span>
      <span class="on"></span><span></span><span></span>
    </span>
    <span class="arraste">arraste</span>
  </div>
</div>
