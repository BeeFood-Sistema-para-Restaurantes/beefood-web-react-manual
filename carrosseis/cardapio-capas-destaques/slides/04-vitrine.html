<!-- O meio do cardápio. O celular sangra pela base, centralizado, mostrando o
     banner do milk shake — é o slide em que o leitor entende que existe um
     segundo lugar para a mídia dele.

     O título carrega o ganho, e não o nome do lugar: "No meio do cardápio, a sua
     vitrine" descreve onde fica, e "Um banner chamativo vende mais combo" diz
     por que vale a pena. O chapéu ficou com a localização.

     Sem emoji no título: "combo" já vai em vermelho, e os dois juntos são grifo
     em cima de grifo. -->
<div class="slide">
  <div class="topo">
    <span class="logo"></span>
    <span class="contador">4 de 7</span>
  </div>

  <div class="pilha g24" style="margin-top: 30px; max-width: 940px">
    <span class="chapeu">No meio do cardápio</span>
    <h2 class="titulo titulo--pequeno">
      Um banner chamativo vende mais <span class="destaque">combo</span>
    </h2>
    <p class="corpo">
      Destaque o combo do dia, a sobremesa nova ou o milk shake num banner entre
      as categorias. Cabem até cinco, em foto ou vídeo.
    </p>
    <p class="corpo">
      É onde o pedido de um lanche vira pedido de combo com sobremesa.
    </p>
  </div>

  <div class="sangria" style="top: 700px; left: 50%; transform: translateX(-50%);
                              width: 660px">
    <div class="celular" style="width: 660px">
      <div class="celular__tela">
        <img src="../imagens-puras/cel-vitrine.png"
             alt="Cardápio no celular com o banner em vídeo do milk shake de morango no meio da página">
      </div>
    </div>
  </div>
</div>
