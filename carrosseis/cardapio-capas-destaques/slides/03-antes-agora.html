<!-- Antes × agora: o topo do MESMO cardápio, no mesmo celular, no mesmo ponto da
     página. À esquerda, sem mídia nenhuma (`--limpo`); à direita, com o vídeo do
     combo na capa. As duas são captura do cardápio de produção.

     Recorte sem moldura de aparelho: com dois celulares desenhados lado a lado
     a tela cairia para 300 px e o banner não leria mais. O que interessa aqui é
     o topo da página, e é ele que ocupa a largura toda. -->
<div class="slide slide--suave">
  <div class="topo">
    <span class="logo"></span>
    <span class="contador">3 de 7</span>
  </div>

  <div class="pilha g24" style="margin-top: 30px">
    <span class="chapeu">Destaques da capa</span>
    <h2 class="titulo titulo--pequeno">
      Olha o que muda no <span class="destaque">topo</span> do cardápio
    </h2>
    <p class="corpo">
      A foto de capa que você escolheu continua lá, no primeiro slide. O vídeo
      entra logo depois dela e roda sozinho, sem o cliente tocar em nada.
    </p>
  </div>

  <div class="par" style="max-width: 904px; gap: 24px; margin: 80px auto 0">
    <div>
      <p style="font-size: 30px; font-weight: 800; color: var(--texto-suave);
                margin-bottom: 16px">Antes</p>
      <div class="recorte recorte--topo" style="aspect-ratio: 440 / 352">
        <img src="../imagens-puras/cel-capa-limpa.png"
             alt="Topo do cardápio no celular com a foto de capa parada">
      </div>
    </div>
    <div>
      <p class="destaque" style="font-size: 30px; font-weight: 800;
                                 margin-bottom: 16px">Agora</p>
      <div class="recorte recorte--topo" style="aspect-ratio: 440 / 352">
        <img src="../imagens-puras/cel-capa-video.png"
             alt="O mesmo topo, agora com o vídeo do combo Smash 2.0 rodando na capa">
      </div>
    </div>
  </div>

  <div class="empurra"></div>

  <div class="rodape">
    <span class="pontos">
      <span></span><span></span><span class="on"></span><span></span>
      <span></span><span></span><span></span>
    </span>
    <span class="arraste">beefood.app</span>
  </div>
</div>
