<!-- O slide da instalacao, e ele existe porque a duvida do leitor nesse ponto
     e pratica: "preciso de que equipamento?". A resposta do release e pequena
     — abre em janela nova, arrasta para a TV, F11 — e e isso que vende.

     O tema entra aqui, e nao numa "dica" solta, porque ele responde a mesma
     pergunta: a TV vai ficar onde? Em cozinha clara, tema claro; em corredor
     de servico, escuro. Os dois lado a lado mostram que e a MESMA tela.

     Sem moldura de aparelho nos dois: com duas TVs desenhadas a tela cairia
     para menos de 400 px e o painel viraria borrao. A moldura ja foi usada na
     capa, que e onde ela conta.

     E FAIXAS, nao telas inteiras. Lado a lado, as duas telas completas ficaram
     com 400 px de largura cada e nenhum numero lia — a comparacao existia e o
     leitor nao conseguia fazer. A faixa e o cabecalho (onde esta o proprio
     botao de sol e lua que o texto cita) mais a primeira linha de cartoes, e
     empilhada ela usa a largura toda do slide. -->
