<!-- Duas promessas do release que sao a mesma coisa, e por isso couberam num
     slide so: a tela se atualiza sozinha e ninguem consegue mexer nela. Juntas
     elas dizem "essa TV nao precisa de dono", que e a ideia de uso.

     A prova e o MESMO pedido fotografado duas vezes. Dois cartoes diferentes
     lado a lado provariam que existem duas colunas, que e o slide 2; o que
     prova "andou" e o #1133 repetido, com o fundo creme virando verde e o
     relogio reiniciando em "Pronto ha 1min".

     Empilhados, e nao lado a lado: o cartao e deitado e largo, e em duas
     colunas o numero cairia para um tamanho que nao le. A seta no meio e o que
     transforma duas fotos numa passagem. -->
<div class="slide">
  <div class="topo">
    <span class="logo"></span>
    <span class="contador">5 de 7</span>
  </div>

  <div class="pilha g24" style="margin-top: 26px; max-width: 920px">
    <span class="chapeu">Sem ninguém operando</span>
    <h2 class="titulo titulo--pequeno">
      O cartão <span class="destaque">muda de coluna</span> na hora
    </h2>
    <p class="corpo">
      Quando a cozinha marca o pedido como pronto, ele salta para o outro lado
      no mesmo instante. E o painel é só leitura: ninguém muda situação,
      atribui entregador nem cancela pedido por ali.
    </p>
  </div>

  <div class="pilha g24" style="margin: 48px auto 0; width: 860px">
    <div>
      <p style="font-size: 28px; font-weight: 800; color: var(--texto-suave);
                margin-bottom: 14px">Em preparo</p>
      <div class="recorte">
        <img src="../imagens-puras/andou-antes.png"
             alt="Cartão do pedido 1133, do iFood, na coluna Em preparo há 4 minutos">
      </div>
    </div>

    <svg width="52" height="52" viewBox="0 0 24 24" fill="none"
         style="align-self: center" aria-hidden="true">
      <path d="M12 4v15m0 0l-6-6m6 6l6-6" stroke="#6b6b6b" stroke-width="2.4"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <div>
      <p class="destaque" style="font-size: 28px; font-weight: 800;
                                 margin-bottom: 14px">Pronto</p>
      <div class="recorte">
        <img src="../imagens-puras/andou-depois.png"
             alt="O mesmo cartão do pedido 1133, agora na coluna Pronto há 1 minuto">
      </div>
    </div>
  </div>

  <div class="empurra"></div>

  <div class="rodape">
    <span class="pontos"><span></span><span></span><span></span><span></span><span class="on"></span><span></span><span></span></span>
    <span class="arraste">arraste</span>
  </div>
</div>
