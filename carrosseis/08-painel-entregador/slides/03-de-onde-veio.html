<!-- A ideia de uso deste slide e a que o release resume em uma linha e que o
     manual explica: o numero grande NAO e sempre o numero do caixa. Quando o
     pedido vem de marketplace, o painel mostra o numero DAQUELE app — que e o
     unico que o entregador tem na mao para conferir.

     Por isso a prova sao tres cartoes, e nao um: um cartao provaria um canal.
     Os tres estao na mesma coluna e na ordem em que o painel os poe, do mais
     antigo para o mais novo, entao o recorte tambem mostra o relogio andando.

     "2740 - Coleta 6118" e um numero real de iFood da sandbox, com a coleta
     junto: e o formato que o entregador procura na tela dele. -->
<div class="slide">
  <div class="topo">
    <span class="logo"></span>
    <span class="contador">3 de 7</span>
  </div>

  <div class="pilha g24" style="margin-top: 26px; max-width: 920px">
    <span class="chapeu">Cada cartão</span>
    <h2 class="titulo titulo--pequeno">
      O número que o entregador
      <span class="destaque">procura no app dele</span>
    </h2>
    <p class="corpo">
      Pedido de iFood, 99Food ou Keeta aparece com a marca do canal e com o
      número daquele aplicativo. O do caixa fica no cantinho, e o relógio ao
      lado diz há quanto tempo o pedido está naquela etapa.
    </p>
  </div>

  <div class="figura" style="margin-top: 44px; width: 880px">
    <div class="recorte">
      <img src="../imagens-puras/cartoes-origens.png"
           alt="Três cartões do painel: Keeta com o número 7412 há 16 minutos, 99Food com 392011 há 9 minutos e iFood com 2740 - Coleta 6118 há 4 minutos">
    </div>
  </div>

  <div class="empurra"></div>

  <div class="rodape">
    <span class="pontos"><span></span><span></span><span class="on"></span><span></span><span></span><span></span><span></span></span>
    <span class="arraste">arraste</span>
  </div>
</div>
