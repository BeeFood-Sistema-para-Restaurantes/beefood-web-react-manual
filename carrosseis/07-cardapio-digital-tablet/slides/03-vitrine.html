<!-- O slide da venda, e o primeiro com prova. A ideia de uso e "a primeira
     tela ja oferece", que e o que separa o tablet de um cardapio de papel: o
     papel lista, a tela anuncia.

     O recorte e o mesmo print da capa, sem a barra do topo e sem a coluna de
     atalhos — la o aparelho e atmosfera, aqui a tela e lida. As duas pecas da
     vitrine aparecem juntas porque sao duas coisas diferentes: o banner, que
     a loja sobe e que leva ao setor ou ao produto anunciado, e a faixa
     `Recomendados`, que o sistema monta.

     O que o slide NAO diz e quanto isso aumenta de ticket. A pagina promete
     40%; numero de resultado nao entra na arte. -->
<div class="slide slide--suave">
  <div class="topo">
    <span class="logo"></span>
    <span class="contador">3 de 9</span>
  </div>

  <div class="pilha g24" style="margin-top: 26px; max-width: 900px">
    <span class="chapeu">A primeira tela</span>
    <h2 class="titulo titulo--pequeno">
      Anuncie o combo antes de o cliente <span class="destaque">procurar</span>
    </h2>
    <p class="corpo">
      O banner da abertura é seu e leva direto ao produto anunciado. Embaixo
      dele, a faixa de recomendados segue à vista enquanto a mesa decide.
    </p>
  </div>

  <div class="figura" style="margin-top: 44px; width: 920px">
    <div class="recorte">
      <img src="../imagens-puras/tablet-vitrine.png"
           alt="Tela inicial do tablet: banner grande com a foto de dois hambúrgueres e batata, e embaixo a faixa Recomendados com cinco combos">
    </div>
  </div>

  <div class="empurra"></div>

  <div class="rodape">
    <span class="pontos"><span></span><span></span><span class="on"></span><span></span><span></span><span></span><span></span><span></span><span></span></span>
    <span class="arraste">arraste</span>
  </div>
</div>
