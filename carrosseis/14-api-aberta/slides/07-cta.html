<!-- Slide 7: o CTA no molde da série para novidade — chapéu "Já está no ar",
     título no imperativo com "hoje", subtítulo com o primeiro passo mais a
     linha de fechamento da casa, e a pílula apontando para o módulo.

     O IMPERATIVO É "LIBERE O ACESSO", e o sujeito do pedido é o leitor, não o
     programador dele. É a diferença que faz esta peça ter CTA: o dono do
     restaurante não vai escrever código nenhum, mas a decisão de abrir a loja
     para outro sistema é dele e só dele. Gerar a credencial e marcar as
     permissões são dois cliques na folha, e é isso que o título pede. O que
     acontece depois é com quem integra.

     A ARTE NÃO REPETE A DA CAPA, pelo mesmo motivo da #13: num carrossel a
     última página é a que fica, e fechar com a ilustração que o leitor viu seis
     telas atrás é fechar com uma lembrança em vez de um caminho. O que entra no
     lugar é o cartão da API Aberta na grade de Aplicativos, capturado — o
     último slide manda abrir Aplicativos → API Aberta, e o cartão é a porta: o
     leitor vê na arte exatamente o que vai procurar quando chegar lá.

     O TEXTO DO CARTÃO SAI CORTADO em "Integre seu sistema ao BeeFood vi…"
     porque é assim que o painel o corta. É print, não arte, e print mostra o
     que está na tela.

     O cartão puro tem 682 px de largura — a mesma medida do cartão do MCP, que
     é a largura de coluna da grade de Aplicativos. A 904 px ele estica 1,33x e a
     letra ainda sai limpa; margem a margem passaria de 1,58x e começaria a
     borrar.

     AS DUAS FORMAS DE AUTENTICAR NÃO ENTRAM AQUI. A documentação separa a
     integração direta (o lojista entrega a credencial) do "Conectar com BeeFood"
     (o lojista autoriza num botão do site da integradora), e a diferença é
     grande para quem integra e invisível para quem lê: nas duas o crachá é o
     mesmo e abre as mesmas portas. Fica na legenda. -->
