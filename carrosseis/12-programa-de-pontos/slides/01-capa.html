     Molde: ANUNCIO DE CHEGADA, usado uma vez em onze pecas (a #8, o Painel
     para Entregadores). E um modulo inteiro nascendo, e a noticia e
     literalmente que ele chegou. A #11 usou nome + para quem, entao a forma
     nao repete a da capa anterior.

     Antes x agora chegou a ser escrito e caiu. O par natural era "antes o
     cashback devolvia dinheiro, agora os pontos criam uma meta": duas frases
     verdadeiras, e o molde faz as duas trabalharem contra a peca, porque a
     primeira metade do titulo fala de outro produto que a BeeFood vende e
     continua vendendo.

     O subtitulo carrega os DOIS eixos da troca. "Cada compra vira desconto"
     entregaria metade do recurso: a recompensa de produto e justamente a que
     custa a loja o preco de um lanche e vale, para quem recebe, um pedido
     inteiro. Concisao corta palavra, nunca eixo.

     O vermelho pega Pontos, uma palavra so, e e a que o leitor vai procurar
     no menu depois — que e a funcao do destaque quando o recurso tem tela
     propria. Na #11 nao tinha, e o vermelho foi para a noticia.

     A imagem e a SACOLA, e nao a vitrine, por causa da miniatura: o cartao
