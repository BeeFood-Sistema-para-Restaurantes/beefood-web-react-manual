<!-- O slide do dinheiro. O adicional e o que sobe o ticket, e no totem ele e
     oferecido em TODO pedido, com foto e com preco na frente — a tela pergunta
     antes de deixar o cliente fechar o item.

     O titulo vem no imperativo e mira nele ("ofereca"), porque quem configura a
     lista e o lojista; o slide 3 e o 5 abrem de outro jeito, e nenhuma abertura
     se repete na peca.

     O controle — `Desativar Totem`, que tira o item do aparelho e tambem da
     sugestao — esta no slide 3, onde ele fala do cardapio. Repetir aqui seria
     dizer duas vezes o mesmo mecanismo.

     O item e avulso, e nao combo, porque no combo o preco sai "A partir de
     R$ 35,90" — e a conta que o slide pede e fechada: R$ 24,00 mais R$ 4,00. -->
<div class="slide">
  <div class="topo">
    <span class="logo"></span>
    <span class="contador">4 de 7</span>
  </div>

  <div class="pilha g24" style="margin-top: 26px; max-width: 900px">
    <span class="chapeu">Venda sugestiva</span>
    <h2 class="titulo titulo--pequeno">
      Ofereça o adicional em <span class="destaque">todo</span> pedido
    </h2>
    <p class="corpo">
      Bacon, carne extra, molho: a tela oferece antes de fechar o item, com
      foto e preço, e quem não quer toca em Pular. A lista é a mesma venda
      sugestiva que você monta no painel.
    </p>
  </div>

  <div class="figura" style="margin-top: 40px; width: 900px">
    <div class="recorte">
      <img src="../imagens-puras/turbinar.png"
           alt="Tela do totem perguntando QUER TURBINAR O SEU BURGER, com bacon a mais R$ 4,00, carne a mais R$ 8,00, cebola caramelizada e queijo cheddar a mais R$ 2,00">
    </div>
  </div>
</div>
