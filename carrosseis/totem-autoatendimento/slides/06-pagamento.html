<!-- O fecho do eixo que a capa prometeu: PAGAR. E o slide que separa o totem de
     um cardapio de consulta, porque e aqui que o pedido termina sem passar por
     ninguem.

     Dois recortes, e nao um. Eles sao duas faixas distantes da MESMA tela — o
     topo, com a pergunta do consumo, e a barra de baixo, com o total e o botao
     — e entre elas ha 800 px de fundo vazio. Cola-los um no outro faria passar
     por uma tela unica, que e o que eles nao sao; por isso vao separados, com
     respiro e com uma legenda curta no meio dizendo de onde cada um saiu.

     O que NAO esta aqui: a tela de identificacao, que fica entre as duas. Ela
     existe e foi capturada, mas o que apareceria na arte sao o nome e o
     telefone de teste do script. -->
<div class="slide">
  <div class="topo">
    <span class="logo"></span>
    <span class="contador">6 de 7</span>
  </div>

  <div class="pilha g24" style="margin-top: 26px; max-width: 900px">
    <span class="chapeu">O pagamento</span>
    <h2 class="titulo titulo--pequeno">
      Comer aqui ou levar, e o pagamento termina <span class="destaque">ali</span>
    </h2>
    <p class="corpo">
      O totem pergunta como será o pedido, soma o total e chama o pagamento no
      próprio aparelho. O pedido sai dali já pago.
    </p>
  </div>

  <div class="figura" style="margin-top: 40px; width: 900px">
    <div class="recorte">
      <img src="../imagens-puras/como-sera.png"
           alt="Tela do totem perguntando Como será o pedido, com as opções Para viagem e Comer aqui">
    </div>
  </div>

  <div class="figura" style="margin-top: 36px; width: 900px">
    <div class="recorte">
      <img src="../imagens-puras/ir-para-pagamento.png"
           alt="Barra de baixo da mesma tela, com Total R$ 24,00 e o botão Ir para pagamento">
    </div>
  </div>

  <div class="empurra"></div>

  <div class="rodape">
    <span class="pontos">
      <span></span><span></span><span></span><span></span>
      <span></span><span class="on"></span><span></span>
    </span>
    <span class="arraste">arraste</span>
  </div>
</div>
