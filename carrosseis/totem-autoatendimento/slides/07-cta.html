<!-- CTA de peca de funcao nao e caminho de menu: quem le pode nao ter painel
     nenhum, e "abra Aplicativos" nao serve de pedido para quem esta escolhendo
     sistema. O endereco e a pagina do totem no site.

     A peca tambem nao diz como se poe um totem na loja — se e equipamento
     comprado, alugado ou aparelho do lojista. Isso nao esta em nenhum manual
     nem em nenhuma tela, e prometer errado no ultimo slide e o pior lugar para
     errar. Quem quiser saber vai na pagina.

     Nenhum "agora" e nenhum "acabou de sair": o totem nao e novidade, e a peca
     vai ser republicada.

     O aparelho volta, e agora com o cardapio na tela em vez da espera: no fim
     a tela nao precisa ser lida — precisa dizer "e o mesmo aparelho do comeco,
     e o que passa nele e o seu cardapio". Ele sangra pela base.

     A imagem e a captura INTEIRA de 720p, e nao o recorte do slide 3: a
     moldura do totem e 9/16 e o `object-fit: cover` recorta o que nao tem essa
     proporcao. Com o recorte, a terceira coluna de produtos entrava cortada no
     meio do nome, e nome cortado na lateral le como defeito de render. -->
<div class="slide slide--capa">
  <div class="topo">
    <span class="logo"></span>
    <span class="contador">7 de 7</span>
  </div>

  <div class="pilha g24" style="margin-top: 40px; max-width: 900px">
    <span class="chapeu">Totem</span>
    <h2 class="titulo titulo--pequeno">
      Conheça o totem por <span class="destaque">dentro</span>
    </h2>
    <p class="subtitulo">
      O aparelho, o cardápio e o pagamento estão em
      <b>beefood.com.br/totem-de-autoatendimento</b>.
    </p>
  </div>

  <div class="sangria" style="top: 600px; right: auto; left: 50%;
                              transform: translateX(-50%)">
    <div class="totem" style="width: 440px; --coluna: 200px">
      <div class="totem__tela">
        <img src="../imagens-puras/cardapio-720.png"
             alt="O mesmo totem com o cardápio na tela, mostrando os setores na coluna e a grade de combos">
      </div>
      <div class="totem__painel">
        <div class="totem__leitor"></div>
        <div class="totem__impressora"></div>
        <div class="totem__pinpad">
          <div class="totem__tecla"><span></span><span></span><span></span></div>
          <div class="totem__tecla"><span></span><span></span><span></span></div>
          <div class="totem__tecla"><span></span><span></span><span></span></div>
        </div>
      </div>
      <div class="totem__coluna"></div>
      <div class="totem__base"></div>
    </div>
  </div>
</div>
