<!-- CTA de peca de funcao nao e caminho de menu: quem le pode nao ter painel
     nenhum, e "abra Aplicativos" nao serve de pedido para quem esta escolhendo
     sistema. O endereco e a pagina do totem no site.

     "Conheca o totem por dentro" era o pedido anterior, e ele nao tinha o que
     prometer: "por dentro" sugere peca, hardware, coisa que a peca nao mostra
     — e o que ela mostra, as telas, o leitor ja acabou de ver em oito slides.
     Convite que repete o que o carrossel entregou nao e convite.

     O pedido agora e uma coisa que SO existe la: a pagina roda um pedido
     inteiro no aparelho, do primeiro toque ao pagamento, e traz barra de
     progresso, botao de pausa e setas para andar tela a tela. Isso e motivo
     para sair do feed; "conheca" nao e.

     O verbo saiu do controle que a pagina tem, e nao do que seria mais bonito
     dizer. "Teste" prometeria pedir de verdade; "veja" jogaria fora a pausa e
     as setas. "Passe pelo pedido, tela por tela" e exatamente o que o visitante
     faz la.

     Isso so foi descoberto na segunda leitura da pagina, e a primeira falhou
     por um motivo de ferramenta: `beefood.com.br/totem-de-autoatendimento`
     devolve uma casca com "Carregando…" e monta o conteudo a partir de um app
     externo. O `pauta.py` agora percebe a casca e segue o endereco.

     A peca continua nao dizendo como se poe um totem na loja — se e
     equipamento comprado, alugado ou aparelho do lojista. Isso nao esta em
     nenhum manual nem em nenhuma tela, e prometer errado no ultimo slide e o
     pior lugar para errar.

     Nenhum "agora" e nenhum "acabou de sair": o totem nao e novidade, e a peca
     vai ser republicada.

     O aparelho volta, e agora com a TELA DE ESPERA: a capa mostra o cardapio,
     porque la a tela precisa dizer "aqui se compra", e o fecho mostra o
     aparelho parado, esperando o proximo cliente. Repetir a mesma tela nas
     duas pontas seria repetir a imagem, nao fechar o arco. E aqui ela ganha
     uma segunda leitura: e a tela em que a demonstracao da pagina comeca.

     A imagem e a captura INTEIRA de 720p, e nao um recorte: a moldura do totem
     e 9/16 e o `object-fit: cover` recorta o que nao tem essa proporcao. -->
