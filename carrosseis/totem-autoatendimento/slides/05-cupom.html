<!-- Primeiro slide de fidelidade. O cupom nao e recurso do totem: e do
     Fidelidade (CRM), e o que a peca afirma e que o TOTEM e um dos canais dele
     — o que esta no manual `cupom-desconto` ("Canais de Visibilidade:
     Delivery, PDV, Mesas/Comandas, Totem").

     Por isso o titulo fala do cupom que ja existe, e nao de um cupom novo:
     quem ja usa cupom no delivery reconhece a propria ferramenta, e quem nao
     usa descobre que ela existe.

     Os dois caminhos estao na tela e sao ditos no texto: digitar o codigo que
     chegou por campanha, ou escolher um da lista. Sao os mesmos dois do
     cardapio digital, e e o que faz o cupom "secreto" funcionar aqui.

     A tela e captura do aplicativo de producao, mas a LISTA nao: a loja de
     exemplo nao tem cupom cadastrado, e o totem esconde a tela inteira quando
     a API devolve lista vazia. Os dois cupons vem de `cupons.json` pela mesma
     interceptacao que o carrossel da traducao usa — o que entra de fora e so o
     que o restaurante escreveria no painel: codigo, titulo, beneficio e regra.

     O recorte comeca ABAIXO do cabecalho da tela, que traz o logotipo da loja:
     cupom de exemplo nao pode parecer promocao anunciada por um cliente nosso. -->
