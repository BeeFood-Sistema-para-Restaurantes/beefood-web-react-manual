<!-- O slide do dinheiro, e ele traz os DOIS momentos em que o totem oferece
     mais: o adicional dentro do item (bacon no hamburguer) e o item novo na
     sacola (batata, bebida, sobremesa), no ultimo toque antes de fechar.

     Eram dois slides ate a peca ganhar cupom e cashback. Viraram um porque a
     ideia de uso e a mesma — a tela oferece antes de deixar fechar — e porque
     o ganho tem de chegar cedo: quem rola o feed costuma parar no quinto
     slide, e com dois slides de venda sugestiva o cupom cairia no sexto.

     As duas faixas sao mais baixas que os recortes dos outros slides, e ainda
    10|     assim legiveis: a letra do totem e grande, e o que importa aqui e o preco
     do adicional, que sai com o mesmo corpo do titulo do produto. A primeira
     termina no vao depois da segunda fileira de adicionais; a segunda, no vao
     depois do quarto cartao de sugestao.

     O selo `Gerada por IA` esta na tela e por isso e dito no texto. Dizer so
     "o sistema sugere" esconderia o que a propria tela anuncia, e quem visse o
     print perguntaria o que e aquela pilula roxa.

     O controle — `Desativar Totem`, que tira o item do aparelho e tambem da
    20|     sugestao — esta no slide 3, onde ele fala do cardapio. -->
<div class="slide">
  <div class="topo">
    <span class="logo"></span>
    <span class="contador">4 de 8</span>
  </div>

  <div class="pilha g24" style="margin-top: 22px; max-width: 900px">
    <span class="chapeu">Venda sugestiva</span>
    <h2 class="titulo titulo--pequeno">
      Ofereça o adicional <span class="destaque">duas vezes</span> no mesmo pedido
    </h2>
    <p class="corpo">
      A tela pergunta antes de fechar o item — bacon, carne, molho, com preço —
      e volta a perguntar na sacola, com uma lista gerada por IA.
    </p>
  </div>

  <div class="figura" style="margin-top: 34px; width: 860px">
    <div class="recorte">
      <img src="../imagens-puras/turbinar-curto.png"
           alt="Tela do totem perguntando Quer turbinar o seu burger, com bacon a mais R$ 4,00 e carne a mais R$ 8,00">
    </div>
  </div>

  <div class="figura" style="margin-top: 26px; width: 860px">
    <div class="recorte">
      <img src="../imagens-puras/peca-tambem.png"
           alt="Bloco Peça também na sacola do totem, com o selo Gerada por IA e os cartões de batata, refrigerante e milk shake com preço">

  </div>
